name: Restore Hidden Policy Radar Excel Backend

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-hidden-policy-excel.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  restore-generate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 최신 운영본과 Git 이력 불러오기
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Python 준비
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 엑셀 생성기 복원
        shell: bash
        run: |
          set -euo pipefail
          source_commit="02f9157262dffa18c637a4cc1481a611d5fd8071"
          git cat-file -e "${source_commit}^{commit}"
          git checkout "$source_commit" -- scripts/export_policy_radar_excel.py
          python -m py_compile scripts/export_policy_radar_excel.py
          python scripts/export_policy_radar_excel.py --self-test

      - name: 전체 이력 기반 임시 입력 생성
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          policy = json.loads(Path("public/data/policies.json").read_text(encoding="utf-8"))
          climate = json.loads(Path("public/data/policy-official-history.json").read_text(encoding="utf-8"))
          motie = json.loads(Path("public/data/motie-policy-history.json").read_text(encoding="utf-8"))

          rows = []
          rows.extend(item for item in climate.get("items", []) if isinstance(item, dict))
          rows.extend(item for item in motie.get("items", []) if isinstance(item, dict))
          rows.extend(
              item for item in policy.get("items", [])
              if isinstance(item, dict) and (item.get("sourceType") == "news" or item.get("section") == "news")
          )

          def key(item):
              section = str(item.get("section") or item.get("sourceType") or "")
              source_id = str(item.get("sourceId") or item.get("id") or "").strip()
              if source_id:
                  return f"{section}|{source_id}"
              url = str(item.get("url") or "").strip()
              if url:
                  return f"{section}|url|{url}"
              title = re.sub(r"[^0-9a-z가-힣]+", "", str(item.get("title") or "").lower())
              return f"{section}|{item.get('publishedAt', '')}|{title}"

          merged = {}
          for item in rows:
              merged[key(item)] = item
          export_input = dict(policy)
          export_input["items"] = sorted(
              merged.values(),
              key=lambda item: (str(item.get("publishedAt", "")), str(item.get("title", ""))),
              reverse=True,
          )
          target = Path("/tmp/policy-radar-export-input.json")
          target.write_text(json.dumps(export_input, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"전체 이력 엑셀 입력 생성: {len(export_input['items']):,}건")
          PY

      - name: 최신 정책 레이더 엑셀 생성
        shell: bash
        run: |
          set -euo pipefail
          python scripts/export_policy_radar_excel.py \
            --policy-path /tmp/policy-radar-export-input.json \
            --bill-path public/data/bills.json \
            --seminar-path public/data/assembly_seminars.json \
            --output public/data/ets-policy-radar-events.xlsx \
            --manifest public/data/policy-radar-excel.json

      - name: 파일 생성과 화면 비노출 검증
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          xlsx = Path("public/data/ets-policy-radar-events.xlsx")
          manifest_path = Path("public/data/policy-radar-excel.json")
          if not xlsx.is_file() or xlsx.stat().st_size < 500_000:
              raise SystemExit("정책 레이더 엑셀 파일이 없거나 비정상적으로 작습니다.")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          required = [
              "기후부 보도자료", "기후부 공지사항", "산업부 보도자료", "산업부 공지사항",
              "한국거래소 공지사항", "뉴스", "기관일정", "발의법률안", "국회의원 세미나 일정",
          ]
          counts = manifest.get("counts") or {}
          if int(manifest.get("sheetCount", 0)) != 11 or any(int(counts.get(name, 0)) <= 0 for name in required):
              raise SystemExit(f"엑셀 탭별 건수 검증 실패: {counts}")
          with zipfile.ZipFile(xlsx) as archive:
              if archive.testzip() is not None:
                  raise SystemExit("XLSX 무결성 검사에 실패했습니다.")

          public_files = [Path("public/index.html"), *Path("public/assets").glob("*.js")]
          forbidden = ("ets-policy-radar-events.xlsx", "전체 리스트 엑셀", "policy-radar-excel.json")
          exposed = []
          for path in public_files:
              if path.is_file() and any(value in path.read_text(encoding="utf-8", errors="ignore") for value in forbidden):
                  exposed.append(str(path))
          if exposed:
              raise SystemExit(f"사이트 화면에 엑셀 링크가 남아 있습니다: {exposed}")
          print(f"숨김 엑셀 검증 완료: {manifest['totalEventCount']:,}건 / 11개 시트")
          PY

      - name: 생성기와 엑셀을 운영 main에 저장
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            scripts/export_policy_radar_excel.py \
            public/data/ets-policy-radar-events.xlsx \
            public/data/policy-radar-excel.json
          git commit -m "feat: restore hidden policy radar Excel files"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            if [[ "$attempt" -eq 3 ]]; then exit 1; fi
            sleep $((attempt * 3))
          done

      - name: 배포 원본 해시 계산
        id: source_hash
        shell: bash
        run: |
          set -euo pipefail
          echo "xlsx=$(sha256sum public/data/ets-policy-radar-events.xlsx | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "manifest=$(sha256sum public/data/policy-radar-excel.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "index=$(sha256sum public/index.html | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "extension=$(sha256sum public/assets/policy-motie-extension.js | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Pages 설정
        uses: actions/configure-pages@v6

      - name: 공개 파일 묶기
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5

      - name: 공개 파일과 화면 비노출 확인
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          XLSX_SHA256: ${{ steps.source_hash.outputs.xlsx }}
          MANIFEST_SHA256: ${{ steps.source_hash.outputs.manifest }}
          INDEX_SHA256: ${{ steps.source_hash.outputs.index }}
          EXTENSION_SHA256: ${{ steps.source_hash.outputs.extension }}
        run: |
          set -euo pipefail
          root="${PAGE_URL%/}"
          verify() {
            local path="$1" expected="$2" output
            output="$(mktemp)"
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl -fsSL --max-time 45 -H "Cache-Control: no-cache" \
                "${root}/${path}?verify=${GITHUB_RUN_ID}-${attempt}" -o "$output"; then
                actual="$(sha256sum "$output" | awk '{print $1}')"
                if [[ "$actual" == "$expected" ]]; then rm -f "$output"; return 0; fi
              fi
              sleep 8
            done
            rm -f "$output"
            echo "::error::공개 ${path} 검증 실패"
            return 1
          }
          verify "data/ets-policy-radar-events.xlsx" "$XLSX_SHA256"
          verify "data/policy-radar-excel.json" "$MANIFEST_SHA256"
          verify "index.html" "$INDEX_SHA256"
          verify "assets/policy-motie-extension.js" "$EXTENSION_SHA256"

          html="$(curl -fsSL --max-time 30 "${root}/index.html?verify-ui=${GITHUB_RUN_ID}")"
          extension="$(curl -fsSL --max-time 30 "${root}/assets/policy-motie-extension.js?verify-ui=${GITHUB_RUN_ID}")"
          if printf '%s\n%s' "$html" "$extension" | grep -Eq \
            'ets-policy-radar-events\.xlsx|전체 리스트 엑셀|policy-radar-excel\.json'; then
            echo "::error::공개 화면 코드에 엑셀 다운로드 링크가 노출돼 있습니다."
            exit 1
          fi
          echo "엑셀 파일은 유지되고 대시보드 화면에는 링크가 없습니다."
