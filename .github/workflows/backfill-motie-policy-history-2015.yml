name: Backfill MOTIE Policy History Since 2015

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backfill-motie-policy-history-2015.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  backfill:
    name: Backfill, validate, commit and deploy MOTIE official history
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate collector and UI extension
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/sync_motie_official_history.py
          python scripts/sync_motie_official_history.py --self-test
          node --check public/assets/policy-motie-extension.js
          grep -Fq 'policy-motie-extension.js' public/index.html

      - name: Backfill industrial ministry materials since 2015
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sync_motie_official_history.py \
            --start-date 2015-01-01 \
            --full \
            2>&1 | tee /tmp/motie-policy-backfill.log

      - name: Validate history and dashboard merge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import urllib.parse
          from pathlib import Path

          history_path = Path("public/data/motie-policy-history.json")
          policy_path = Path("public/data/policies.json")
          if not history_path.is_file() or not policy_path.is_file():
              raise SystemExit("산업부 백필 출력 파일이 생성되지 않았습니다.")
          if history_path.stat().st_size > 8_000_000:
              raise SystemExit("motie-policy-history.json이 8MB를 초과했습니다.")
          if policy_path.stat().st_size > 8_000_000:
              raise SystemExit("policies.json이 8MB를 초과했습니다.")

          history = json.loads(history_path.read_text(encoding="utf-8"))
          policies = json.loads(policy_path.read_text(encoding="utf-8"))
          if history.get("requestedStartDate") != "2015-01-01":
              raise SystemExit("산업부 백필 기준일이 2015-01-01이 아닙니다.")
          if history.get("collectionMode") != "full":
              raise SystemExit("초기 산업부 수집이 전체 백필 모드가 아닙니다.")

          items = history.get("items")
          if not isinstance(items, list) or not items:
              raise SystemExit("산업부 공식자료 전체 이력이 비어 있습니다.")
          required_sections = {"motie_press", "motie_notice"}
          counts = {section: 0 for section in required_sections}
          dates = {section: [] for section in required_sections}
          seen = set()
          for index, item in enumerate(items):
              section = str(item.get("section", ""))
              source_id = str(item.get("sourceId", ""))
              published = str(item.get("publishedAt", ""))[:10]
              if section not in required_sections:
                  raise SystemExit(f"산업부 items[{index}] section 오류: {section}")
              if not source_id or not str(item.get("title", "")).strip():
                  raise SystemExit(f"산업부 items[{index}] 게시물 ID 또는 제목 누락")
              if not re.fullmatch(r"20\d{2}-\d{2}-\d{2}", published) or published < "2015-01-01":
                  raise SystemExit(f"산업부 items[{index}] 게시일 오류: {published}")
              host = (urllib.parse.urlsplit(str(item.get("url", ""))).hostname or "").lower()
              if host not in {"motir.go.kr", "www.motir.go.kr"}:
                  raise SystemExit(f"산업부 items[{index}] 공식 도메인 오류: {host}")
              key = f"{section}|{source_id}"
              if key in seen:
                  raise SystemExit(f"산업부 공식자료 중복: {key}")
              seen.add(key)
              counts[section] += 1
              dates[section].append(published)
          if any(value <= 0 for value in counts.values()):
              raise SystemExit(f"산업부 구분별 수집 결과가 비었습니다: {counts}")

          audits = history.get("sourceAudit")
          if not isinstance(audits, list) or len(audits) != 2:
              raise SystemExit("산업부 2개 게시판의 수집 감사정보가 없습니다.")
          for audit in audits:
              if audit.get("complete") is not True:
                  raise SystemExit(f"완료되지 않은 산업부 게시판 수집: {audit}")
              if audit.get("searchMode") != "official-title-and-content-query":
                  raise SystemExit(f"산업부 검색방식 오류: {audit}")
              queries = audit.get("queries")
              if not isinstance(queries, list) or len(queries) != 14:
                  raise SystemExit(f"산업부 제목·내용 14개 검색조합이 확인되지 않습니다: {audit}")

          dashboard_motie = [
              item for item in policies.get("items", [])
              if str(item.get("section", "")) in required_sections
          ]
          if len(dashboard_motie) != len(items):
              raise SystemExit(
                  f"대시보드 산업부 {len(dashboard_motie)}건과 전체 이력 {len(items)}건이 다릅니다."
              )
          climate_count = int((policies.get("officialHistory") or {}).get("itemCount", 0))
          if climate_count < 794:
              raise SystemExit(f"기존 기후부·KRX 전체 이력이 감소했습니다: {climate_count}")
          metadata = policies.get("motieOfficialHistory") or {}
          if int(metadata.get("itemCount", -1)) != len(items):
              raise SystemExit("대시보드 산업부 전체 이력 메타데이터가 일치하지 않습니다.")

          print(f"MOTIE_BACKFILL_TOTAL={len(items)}")
          print("MOTIE_BACKFILL_COUNTS=" + json.dumps(counts, ensure_ascii=False))
          print("MOTIE_BACKFILL_EARLIEST=" + json.dumps({k: min(v) for k, v in dates.items()}, ensure_ascii=False))
          print("MOTIE_BACKFILL_LATEST=" + json.dumps({k: max(v) for k, v in dates.items()}, ensure_ascii=False))
          print(f"MOTIE_HISTORY_BYTES={history_path.stat().st_size}")
          print(f"POLICIES_BYTES={policy_path.stat().st_size}")
          PY

      - name: Commit industrial ministry history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/motie-policy-history.json public/data/policies.json

          if git diff --cached --quiet; then
            echo "산업부 공식자료 전체 이력에 변경이 없습니다."
          else
            git commit -m "data: backfill industrial ministry policy history since 2015"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "산업부 공식자료 전체 이력 저장 완료"
                break
              fi
              echo "동시 업데이트 감지: ${attempt}/3 재시도"
              git rebase --abort 2>/dev/null || true
              if [[ "$attempt" -eq 3 ]]; then
                echo "::error::산업부 공식자료 전체 이력 push에 실패했습니다."
                exit 1
              fi
              sleep $((attempt * 3))
            done
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload complete public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Deploy dashboard with industrial ministry history
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public tabs and official history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          import urllib.request

          base = "https://ebrain725.github.io"
          last_error = ""
          for attempt in range(1, 9):
              try:
                  nonce = f"{int(time.time())}-{attempt}"
                  def read(path):
                      request = urllib.request.Request(
                          f"{base}/{path}?verify={nonce}",
                          headers={"User-Agent": "ETS-LIVE-DASHBOARD/5.0"},
                      )
                      with urllib.request.urlopen(request, timeout=40) as response:
                          return response.read()

                  history = json.loads(read("data/motie-policy-history.json").decode("utf-8"))
                  policies = json.loads(read("data/policies.json").decode("utf-8"))
                  index_html = read("index.html").decode("utf-8")
                  extension = read("assets/policy-motie-extension.js").decode("utf-8")
                  history_items = history.get("items", [])
                  sections = {item.get("section") for item in history_items}
                  dashboard_items = [
                      item for item in policies.get("items", [])
                      if item.get("section") in {"motie_press", "motie_notice"}
                  ]
                  if not history_items or sections != {"motie_press", "motie_notice"}:
                      raise RuntimeError(f"공개 산업부 이력 구분 오류: {sections}")
                  if len(dashboard_items) != len(history_items):
                      raise RuntimeError(
                          f"공개 대시보드 산업부 {len(dashboard_items)}건 != 이력 {len(history_items)}건"
                      )
                  if "policy-motie-extension.js" not in index_html:
                      raise RuntimeError("공개 index.html에 산업부 탭 확장 스크립트가 없습니다.")
                  if "산업부 보도자료" not in extension or "산업부 공지사항" not in extension:
                      raise RuntimeError("공개 산업부 탭 라벨이 없습니다.")
                  print(f"공개 산업부 공식자료 확인 완료: {len(history_items)}건")
                  break
              except Exception as exc:
                  last_error = str(exc)
              if attempt == 8:
                  raise SystemExit(f"산업부 공개본 검증 실패: {last_error}")
              time.sleep(8)
          PY

      - name: Preserve collection log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motie-policy-backfill-${{ github.run_id }}
          path: /tmp/motie-policy-backfill.log
          if-no-files-found: ignore
          retention-days: 14
