name: Remove preallocation parenthetical display

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/remove-preallocation-parenthetical.yml"

permissions:
  contents: write

jobs:
  update-display:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove parenthetical preallocation value
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path("public/assets/krx-annual-balance-v2.js")
          js_text = js_path.read_text(encoding="utf-8")
          old_js = '''      preAllocationCell.querySelector(".annual-applied-preallocation")?.remove();
                preAllocationCell.classList.add("annual-preallocation-with-applied");
                preAllocationCell.append(appliedMarkup(metricSummary(sourceRows, "appliedPreAllocation")));'''
          old_js = old_js.replace("                ", "      ")
          new_js = '''      preAllocationCell.querySelector(".annual-applied-preallocation")?.remove();
                preAllocationCell.classList.remove("annual-preallocation-with-applied");'''
          new_js = new_js.replace("                ", "      ")
          if old_js not in js_text:
              raise SystemExit("Target JavaScript block was not found exactly once.")
          if js_text.count(old_js) != 1:
              raise SystemExit(f"Unexpected JavaScript target count: {js_text.count(old_js)}")
          js_path.write_text(js_text.replace(old_js, new_js, 1), encoding="utf-8")

          html_path = Path("public/krx-annual.html")
          html_text = html_path.read_text(encoding="utf-8")
          old_html = 'title="첫 줄은 원자료 사전할당량, 괄호는 전년도 추가할당·할당취소 반영값입니다."'
          new_html = 'title="원자료 사전할당량입니다."'
          if old_html not in html_text:
              raise SystemExit("Target HTML title was not found exactly once.")
          if html_text.count(old_html) != 1:
              raise SystemExit(f"Unexpected HTML target count: {html_text.count(old_html)}")
          html_path.write_text(html_text.replace(old_html, new_html, 1), encoding="utf-8")
          PY

      - name: Commit the display change
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/krx-annual-balance-v2.js public/krx-annual.html
          git commit -m "fix: remove preallocation parenthetical display"
          git push origin HEAD:main
