name: Export Policy Radar Excel

on:
  workflow_run:
    workflows: ["Merge Industrial Ministry Policy History"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/export_policy_radar_excel.py"
      - "public/assets/policy-motie-extension.js"
      - ".github/workflows/export-policy-radar-excel.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  export-and-deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 최신 운영본 불러오기
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Python 준비
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 엑셀 생성기 검증
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/export_policy_radar_excel.py
          python scripts/export_policy_radar_excel.py --self-test
          node --check public/assets/policy-motie-extension.js

      - name: 정책 레이더 전체 엑셀 생성
        shell: bash
        run: |
          set -euo pipefail
          python scripts/export_policy_radar_excel.py \
            --policy-path public/data/policies.json \
            --bill-path public/data/bills.json \
            --seminar-path public/data/assembly_seminars.json \
            --output public/data/ets-policy-radar-events.xlsx \
            --manifest public/data/policy-radar-excel.json

      - name: 엑셀 구성·건수 검증
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path
          from xml.etree import ElementTree as ET

          xlsx = Path("public/data/ets-policy-radar-events.xlsx")
          manifest_path = Path("public/data/policy-radar-excel.json")
          if not xlsx.is_file() or xlsx.stat().st_size < 100_000:
              raise SystemExit(f"엑셀 파일이 없거나 비정상적으로 작습니다: {xlsx.stat().st_size if xlsx.exists() else 0}")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          counts = manifest.get("counts") or {}
          required = [
              "기후부 보도자료", "기후부 공지사항", "산업부 보도자료", "산업부 공지사항",
              "한국거래소 공지사항", "뉴스", "기관일정", "발의법률안", "국회의원 세미나 일정",
          ]
          missing = [name for name in required if name not in counts]
          if missing:
              raise SystemExit(f"엑셀 탭별 건수 누락: {missing}")
          if any(int(counts[name]) <= 0 for name in required):
              raise SystemExit(f"0건인 엑셀 탭이 있습니다: {counts}")
          expected_total = sum(int(counts[name]) for name in required)
          if int(manifest.get("totalEventCount", -1)) != expected_total:
              raise SystemExit(f"전체 건수 불일치: {manifest.get('totalEventCount')} / {expected_total}")
          if int(manifest.get("sheetCount", 0)) != 11:
              raise SystemExit(f"엑셀 시트 수 오류: {manifest.get('sheetCount')}")

          with zipfile.ZipFile(xlsx) as archive:
              if archive.testzip() is not None:
                  raise SystemExit("XLSX ZIP 무결성 검사 실패")
              names = set(archive.namelist())
              required_parts = {
                  "[Content_Types].xml", "xl/workbook.xml", "xl/styles.xml",
                  *{f"xl/worksheets/sheet{index}.xml" for index in range(1, 12)},
              }
              absent = required_parts - names
              if absent:
                  raise SystemExit(f"XLSX 구성요소 누락: {sorted(absent)}")
              workbook = ET.fromstring(archive.read("xl/workbook.xml"))
              namespace = {"x": "http://schemas.openxmlformats.org/spreadsheetml/2006/main"}
              sheet_names = [node.attrib["name"] for node in workbook.findall("x:sheets/x:sheet", namespace)]
              if len(sheet_names) != 11 or "전체 이벤트" not in sheet_names:
                  raise SystemExit(f"XLSX 시트 목록 오류: {sheet_names}")
          print(f"정책 레이더 엑셀 검증 완료: {expected_total:,}건 / 11개 시트 / {xlsx.stat().st_size:,}바이트")
          PY

      - name: 엑셀 파일 운영 저장소에 보존
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/ets-policy-radar-events.xlsx public/data/policy-radar-excel.json

          if git diff --cached --quiet; then
            echo "엑셀 파일에 변경이 없습니다."
          else
            git commit -m "data: export all policy radar tabs to Excel"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "정책 레이더 엑셀 저장 완료"
                break
              fi
              if [[ "$attempt" -eq 3 ]]; then
                echo "::error::정책 레이더 엑셀 저장에 실패했습니다."
                exit 1
              fi
              sleep $((attempt * 3))
            done
          fi

      - name: 배포 원본 해시 계산
        id: source_hash
        shell: bash
        run: |
          set -euo pipefail
          echo "xlsx=$(sha256sum public/data/ets-policy-radar-events.xlsx | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "manifest=$(sha256sum public/data/policy-radar-excel.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "extension=$(sha256sum public/assets/policy-motie-extension.js | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 전체 공개 파일 묶기
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: 엑셀 포함 GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 공개 엑셀 다운로드 검증
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          XLSX_SHA256: ${{ steps.source_hash.outputs.xlsx }}
          MANIFEST_SHA256: ${{ steps.source_hash.outputs.manifest }}
          EXTENSION_SHA256: ${{ steps.source_hash.outputs.extension }}
        run: |
          set -euo pipefail
          page_root="${PAGE_URL%/}"

          verify_file() {
            local relative_path="$1"
            local expected="$2"
            local output
            output="$(mktemp)"
            for attempt in 1 2 3 4 5 6 7; do
              if curl --fail --silent --show-error --location \
                --max-time 40 \
                --header "Cache-Control: no-cache" \
                "${page_root}/${relative_path}?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" \
                --output "$output"; then
                actual="$(sha256sum "$output" | awk '{print $1}')"
                if [[ "$actual" == "$expected" ]]; then
                  echo "공개 ${relative_path} 확인 완료: ${actual}"
                  rm -f "$output"
                  return 0
                fi
              fi
              sleep 8
            done
            rm -f "$output"
            echo "::error::공개 ${relative_path}이 배포 원본과 일치하지 않습니다."
            return 1
          }

          verify_file "data/ets-policy-radar-events.xlsx" "$XLSX_SHA256"
          verify_file "data/policy-radar-excel.json" "$MANIFEST_SHA256"
          verify_file "assets/policy-motie-extension.js" "$EXTENSION_SHA256"
