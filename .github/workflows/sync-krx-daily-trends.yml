name: Sync KRX Daily Trading Trends

on:
  # 기존 cron-job.org가 실행하는 정책 워크플로 완료 신호만 이용합니다.
  # 기존 정책·시장 워크플로 파일과 스케줄은 변경하지 않습니다.
  # 수집기·워크플로 코드가 바뀐 경우에는 배포 직후 1회 검증 수집합니다.
  push:
    branches:
      - main
    paths:
      - scripts/sync_krx_daily_trends.py
      - scripts/krx_daily_manual_overrides.json
      - .github/workflows/sync-krx-daily-trends.yml
  workflow_run:
    workflows:
      - Sync Ministry Policies
    types:
      - completed
  workflow_dispatch:
    inputs:
      mode:
        description: "수집 방식"
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - backfill
      backfill_pages:
        description: "이번 실행에서 처리할 과거 목록 페이지 수(1~60)"
        required: true
        default: "5"
        type: choice
        options:
          - "1"
          - "3"
          - "5"
          - "10"
          - "20"
          - "60"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # 기존 Pages 배포와 같은 그룹을 사용해 서로의 공개본을 덮어쓰지 않습니다.
  group: github-pages
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  collect:
    name: Collect and validate KRX daily trend PDFs
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Select collection window
        id: window
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_BACKFILL_PAGES: ${{ inputs.backfill_pages }}
          PARENT_RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          PARENT_RUN_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          PARENT_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          should_run=true
          mode="${INPUT_MODE:-incremental}"
          pages="${INPUT_BACKFILL_PAGES:-3}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            parent_started="${PARENT_RUN_STARTED_AT:-${PARENT_RUN_CREATED_AT:-}}"
            if [[ -z "$parent_started" ]]; then
              echo "::error::상위 정책 워크플로 시작 시각을 확인할 수 없습니다."
              exit 1
            fi
            hour="$(TZ=Asia/Seoul date --date="$parent_started" +%H)"
            # 기존 외부 스케줄의 아침·저녁 실행만 활용합니다.
            if [[ "$hour" != "08" && "$hour" != "18" ]]; then
              should_run=false
              echo "KRX 일일동향 생략: 상위 실행 시작 KST ${hour}시는 08시·18시 수집 창이 아닙니다."
            fi
            # 정책 수집의 국회 API 등이 실패해도 KRX 수집은 서로 독립적이므로
            # 완료 신호와 시작 시각만 사용합니다.
            echo "상위 정책 워크플로 결론: ${PARENT_RUN_CONCLUSION:-unknown}"
            mode="incremental"
            pages="3"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            # 이 수집기·워크플로 변경을 반영하는 최초 push에서
            # 기존 활성 보고서 PDF 누락분을 전체 백필한다.
            # 누락 PDF가 없으면 페이지 재탐색·다운로드는 실행하지 않는다.
            mode="backfill"
            pages="60"
          fi

          case "$mode" in
            incremental|backfill) ;;
            *)
              echo "::error::지원하지 않는 수집 방식입니다: $mode"
              exit 1
              ;;
          esac
          case "$pages" in
            1|3|5|10|20|60) ;;
            *)
              echo "::error::backfill_pages는 1, 3, 5, 10, 20, 60 중 하나여야 합니다."
              exit 1
              ;;
          esac

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "pages=$pages" >> "$GITHUB_OUTPUT"
          echo "수집 방식: $mode / 과거 페이지: $pages"

      - name: Set up Python
        if: steps.window.outputs.should_run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PDF text tools
        if: steps.window.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          pdfinfo -v 2>&1 | head -n 1
          pdftotext -v 2>&1 | head -n 1

      - name: Check collector and seed files
        if: steps.window.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/sync_krx_daily_trends.py
          test -f scripts/krx_daily_manual_overrides.json
          test -f public/data/krx-daily/index.json
          test -f public/data/krx-daily/latest.json
          test -f public/data/krx-daily/quality.json
          python -B - <<'PY'
          from pathlib import Path

          path = Path("scripts/sync_krx_daily_trends.py")
          compile(path.read_text(encoding="utf-8"), str(path), "exec")
          print("sync_krx_daily_trends.py 문법 검증 완료")
          PY

      - name: Collect KRX daily trading trends
        if: steps.window.outputs.should_run == 'true'
        shell: bash
        env:
          KRX_DAILY_MODE: ${{ steps.window.outputs.mode }}
          KRX_DAILY_BACKFILL_PAGES: ${{ steps.window.outputs.pages }}
          KRX_DAILY_REVISION_CHECKS: "3"
        run: |
          set -euo pipefail
          # 손상된 기존 누적본을 빈 데이터로 오인해 덮어쓰지 않도록
          # 네트워크 수집 전에 먼저 검증합니다.
          python -B scripts/sync_krx_daily_trends.py --mode validate
          python -B scripts/sync_krx_daily_trends.py

      - name: Validate accumulated KRX trend data
        if: steps.window.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/sync_krx_daily_trends.py --mode validate

      - name: Confirm only KRX daily trend data changed
        if: steps.window.outputs.should_run == 'true'
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          changed_paths="$({
            git diff --name-only
            git diff --cached --name-only
            git ls-files --others --exclude-standard
          } | sort -u)"

          unexpected=0
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              public/data/krx-daily/index.json|public/data/krx-daily/latest.json|public/data/krx-daily/quality.json) ;;
              public/data/krx-daily/by-month/20[0-9][0-9]-0[1-9].json) ;;
              public/data/krx-daily/by-month/20[0-9][0-9]-1[0-2].json) ;;
              public/data/krx-daily/sources/20[0-9][0-9].json) ;;
              public/data/krx-daily/pdfs/20[0-9][0-9]-0[1-9]/20[0-9][0-9]-0[1-9]-[0-3][0-9].pdf) ;;
              public/data/krx-daily/pdfs/20[0-9][0-9]-1[0-2]/20[0-9][0-9]-1[0-2]-[0-3][0-9].pdf) ;;
              *)
                echo "::error::KRX 일일동향 수집기가 허용되지 않은 파일을 변경했습니다: $path"
                unexpected=1
                ;;
            esac
          done <<< "$changed_paths"
          if [[ "$unexpected" -ne 0 ]]; then
            exit 1
          fi

          if find public/data/krx-daily -type f -name '*.tmp' -print -quit | grep -q .; then
            echo "::error::공개 경로에 임시파일이 남았습니다."
            exit 1
          fi

          while IFS= read -r pdf_path; do
            case "$pdf_path" in
              public/data/krx-daily/pdfs/20[0-9][0-9]-0[1-9]/20[0-9][0-9]-0[1-9]-[0-3][0-9].pdf) ;;
              public/data/krx-daily/pdfs/20[0-9][0-9]-1[0-2]/20[0-9][0-9]-1[0-2]-[0-3][0-9].pdf) ;;
              *)
                echo "::error::허용되지 않은 PDF 공개 경로입니다: $pdf_path"
                exit 1
                ;;
            esac
            if [[ "$(head -c 5 "$pdf_path")" != "%PDF-" ]]; then
              echo "::error::PDF 헤더가 올바르지 않습니다: $pdf_path"
              exit 1
            fi
          done < <(find public/data/krx-daily -type f -name '*.pdf' | sort)

          # 수집기 검증은 각 PDF의 크기·SHA-256을 활성 report와 대조한다.
          python -B scripts/sync_krx_daily_trends.py --mode validate

          if [[ -n "$(git status --porcelain -- public/data/krx-daily)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "저장할 KRX 일일동향 변경사항이 없습니다."
          fi

      - name: Commit KRX daily trend data
        if: >-
          steps.window.outputs.should_run == 'true' &&
          steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/data/krx-daily
          git diff --cached --check
          staged="$(git diff --cached --name-only)"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              public/data/krx-daily/index.json|public/data/krx-daily/latest.json|public/data/krx-daily/quality.json) ;;
              public/data/krx-daily/by-month/20[0-9][0-9]-0[1-9].json) ;;
              public/data/krx-daily/by-month/20[0-9][0-9]-1[0-2].json) ;;
              public/data/krx-daily/sources/20[0-9][0-9].json) ;;
              public/data/krx-daily/pdfs/20[0-9][0-9]-0[1-9]/20[0-9][0-9]-0[1-9]-[0-3][0-9].pdf) ;;
              public/data/krx-daily/pdfs/20[0-9][0-9]-1[0-2]/20[0-9][0-9]-1[0-2]-[0-3][0-9].pdf) ;;
              *)
                echo "::error::허용되지 않은 커밋 대상입니다: $path"
                exit 1
                ;;
            esac
          done <<< "$staged"
          git commit -m "chore(data): sync KRX daily trading trends"

      - name: Rebase safely and push to main
        if: >-
          steps.window.outputs.should_run == 'true' &&
          steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          pushed=0
          for attempt in 1 2 3; do
            echo "main 반영 시도 ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::원격 main과 KRX 일일동향 데이터가 충돌했습니다. 강제 푸시하지 않습니다."
              exit 1
            fi
            python -B scripts/sync_krx_daily_trends.py --mode validate
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
          done

          if [[ "$pushed" -ne 1 ]]; then
            echo "::error::원격 main 변경으로 3회 푸시 시도 후 중단했습니다."
            exit 1
          fi

          echo "KRX 일일동향 데이터 반영 완료: $(git rev-parse HEAD)"

      - name: Align deployment source with committed main
        if: >-
          steps.window.outputs.should_run == 'true' &&
          steps.changes.outputs.changed == 'true'
        id: source_revision
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::배포 직전 로컬 HEAD와 origin/main이 갈라졌습니다."
              exit 1
            fi
            git merge --ff-only origin/main
          fi
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "::error::배포 원본이 최신 origin/main과 일치하지 않습니다."
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::배포 직전 작업트리가 커밋 상태와 다릅니다."
            git status --short
            exit 1
          fi

          python -B scripts/sync_krx_daily_trends.py --mode validate
          for data_file in public/data/krx-daily/index.json public/data/krx-daily/latest.json; do
            committed_hash="$(git show "HEAD:${data_file}" | sha256sum | awk '{print $1}')"
            worktree_hash="$(sha256sum "$data_file" | awk '{print $1}')"
            if [[ "$committed_hash" != "$worktree_hash" ]]; then
              echo "::error::배포할 ${data_file}이 현재 HEAD 커밋과 다릅니다."
              exit 1
            fi
          done

          echo "index_sha256=$(sha256sum public/data/krx-daily/index.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "latest_sha256=$(sha256sum public/data/krx-daily/latest.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          latest_pdf_path="$(python -B - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("public/data/krx-daily/latest.json").read_text(encoding="utf-8")
          )
          print(str((payload.get("item") or {}).get("pdfUrl") or ""))
          PY
          )"
          if [[ -z "$latest_pdf_path" || ! -f "public/$latest_pdf_path" ]]; then
            echo "::error::최신 활성 보고서 PDF가 배포 원본에 없습니다."
            exit 1
          fi
          echo "latest_pdf_path=$latest_pdf_path" >> "$GITHUB_OUTPUT"
          echo "latest_pdf_sha256=$(sha256sum "public/$latest_pdf_path" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "배포 원본 커밋: $(git rev-parse HEAD)"

      - name: Configure GitHub Pages
        if: steps.source_revision.outcome == 'success'
        uses: actions/configure-pages@v6

      - name: Upload the committed public directory
        if: steps.source_revision.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: Deploy GitHub Pages
        if: steps.source_revision.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify public KRX daily trend indexes and latest PDF
        if: steps.source_revision.outcome == 'success'
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_INDEX_SHA256: ${{ steps.source_revision.outputs.index_sha256 }}
          EXPECTED_LATEST_SHA256: ${{ steps.source_revision.outputs.latest_sha256 }}
          LATEST_PDF_PATH: ${{ steps.source_revision.outputs.latest_pdf_path }}
          EXPECTED_LATEST_PDF_SHA256: ${{ steps.source_revision.outputs.latest_pdf_sha256 }}
        run: |
          set -euo pipefail

          page_root="${PAGE_URL%/}"
          verify_public_file() {
            local relative_path="$1"
            local expected_sha256="$2"
            local downloaded
            downloaded="$(mktemp)"
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl --fail --silent --show-error --location \
                --max-time 20 \
                --header "Cache-Control: no-cache" \
                "${page_root}/${relative_path}?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" \
                --output "$downloaded"; then
                actual_sha256="$(sha256sum "$downloaded" | awk '{print $1}')"
                if [[ "$actual_sha256" == "$expected_sha256" ]]; then
                  echo "공개 ${relative_path} 반영 확인: $actual_sha256"
                  rm -f "$downloaded"
                  return 0
                fi
              fi
              sleep 8
            done
            rm -f "$downloaded"
            echo "::error::Pages 공개 ${relative_path}이 배포 원본과 일치하지 않습니다."
            return 1
          }

          verify_public_file "data/krx-daily/index.json" "$EXPECTED_INDEX_SHA256"
          verify_public_file "data/krx-daily/latest.json" "$EXPECTED_LATEST_SHA256"
          verify_public_file "$LATEST_PDF_PATH" "$EXPECTED_LATEST_PDF_SHA256"

      - name: Require complete active PDF archive
        if: steps.source_revision.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import json
          from pathlib import Path

          data_root = Path("public/data/krx-daily")
          reports = []
          for month_path in sorted((data_root / "by-month").glob("20??-??.json")):
              payload = json.loads(month_path.read_text(encoding="utf-8"))
              reports.extend(
                  item for item in payload.get("items", []) if isinstance(item, dict)
              )

          missing = []
          expected_paths = set()
          for report in reports:
              trade_date = str(report.get("tradeDate") or "")
              expected_url = (
                  f"data/krx-daily/pdfs/{trade_date[:7]}/{trade_date}.pdf"
              )
              pdf_url = report.get("pdfUrl")
              if pdf_url != expected_url or not (Path("public") / expected_url).is_file():
                  missing.append(trade_date or "unknown")
                  continue
              expected_paths.add((Path("public") / expected_url).resolve())

          actual_paths = {
              path.resolve() for path in (data_root / "pdfs").glob("20??-??/20??-??-??.pdf")
          }
          extras = sorted(str(path) for path in actual_paths - expected_paths)
          if missing or extras or len(expected_paths) != len(reports):
              print(
                  "::error::활성 PDF 전체 보관 미완료: "
                  f"보고서 {len(reports)}건, 정상 PDF {len(expected_paths)}건, "
                  f"누락 {len(missing)}건, 초과 {len(extras)}건"
              )
              if missing:
                  print("누락 거래일(최대 20건):", ", ".join(missing[:20]))
              if extras:
                  print("초과 PDF(최대 20건):", ", ".join(extras[:20]))
              raise SystemExit(1)
          print(f"활성 PDF 전체 보관 확인: {len(reports)}건")
          PY
