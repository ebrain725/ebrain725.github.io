name: Install monthly industry trading dashboard

on:
  push:
    branches:
      - main
    paths:
      - "scripts/krx-industry-monthly-bundle.ready"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and extract prepared dashboard files
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            scripts/krx-industry-monthly-bundle.b64.part00
            scripts/krx-industry-monthly-bundle.b64.part01
            scripts/krx-industry-monthly-bundle.b64.part02a
            scripts/krx-industry-monthly-bundle.b64.part02b
            scripts/krx-industry-monthly-bundle.b64.part03
            scripts/krx-industry-monthly-bundle.b64.part04
          )
          for part in "${parts[@]}"; do
            [[ -f "$part" ]] || { echo "::error::Missing staged bundle part: $part"; exit 1; }
          done
          cat "${parts[@]}" | base64 --decode > /tmp/krx-industry-monthly-bundle.tar.gz
          echo "98039a24f320e66c8edcd2452e99cb16ef306ce8fbc5685b7267c1be468033ec  /tmp/krx-industry-monthly-bundle.tar.gz" | sha256sum --check
          tar -xzf /tmp/krx-industry-monthly-bundle.tar.gz -C .

      - name: Add the monthly-industry tab to existing KRX pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          pages = {
              Path("public/krx-trends.html"): (
                  '<a href="krx-industry-monthly.html?v=20260902-industry-monthly-v1">업종 매매현황(월간)</a>'
              ),
              Path("public/krx-annual.html"): (
                  '<a href="krx-industry-monthly.html?v=20260902-industry-monthly-v1">업종 매매현황(월간)</a>'
              ),
          }

          pattern = re.compile(
              r'(<nav class="krx-subnav" aria-label="KRX 거래동향 세부 메뉴">)(.*?)(\n\s*</nav>)',
              re.DOTALL,
          )

          for path, link in pages.items():
              text = path.read_text(encoding="utf-8")
              if "krx-industry-monthly.html" in text:
                  continue
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f"{path}: KRX subnav match count is {len(matches)}")
              match = matches[0]
              replacement = match.group(1) + match.group(2) + "\n      " + link + match.group(3)
              text = text[:match.start()] + replacement + text[match.end():]
              path.write_text(text, encoding="utf-8")
          PY

      - name: Validate generated data and scripts
        shell: bash
        run: |
          set -euo pipefail
          node --check public/assets/krx-industry-monthly.js
          python -m json.tool public/data/krx-industry-monthly.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("public/data/krx-industry-monthly.json").read_text(encoding="utf-8"))
          months = payload["months"]
          totals = payload["totals"]
          industries = payload["industries"]
          assert len(months) == payload["coverage"]["monthCount"] == 48
          assert len(industries) == payload["coverage"]["industryCount"] == 73
          assert len(totals) == len(months)
          for month_index, total in enumerate(totals):
              total_sell, total_buy, allocated_sell, allocated_buy, other_sell, other_buy = total
              industry_sell = sum(item[3][month_index][0] for item in industries)
              industry_buy = sum(item[3][month_index][1] for item in industries)
              assert total_sell == total_buy
              assert (industry_sell, industry_buy) == (allocated_sell, allocated_buy)
              assert allocated_sell + other_sell == total_sell
              assert allocated_buy + other_buy == total_buy
          PY
          grep -q "업종 매매현황(월간)" public/krx-trends.html
          grep -q "업종 매매현황(월간)" public/krx-annual.html
          grep -q "업종 매매현황(월간)" public/krx-industry-monthly.html

      - name: Commit dashboard files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            public/krx-trends.html \
            public/krx-annual.html \
            public/krx-industry-monthly.html \
            public/assets/krx-industry-monthly.css \
            public/assets/krx-industry-monthly.js \
            public/data/krx-industry-monthly.json \
            source-data/krx-industry-monthly/industry-monthly-source.csv \
            source-data/krx-industry-monthly/README.md; then
            echo "No dashboard changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/krx-trends.html \
            public/krx-annual.html \
            public/krx-industry-monthly.html \
            public/assets/krx-industry-monthly.css \
            public/assets/krx-industry-monthly.js \
            public/data/krx-industry-monthly.json \
            source-data/krx-industry-monthly/industry-monthly-source.csv \
            source-data/krx-industry-monthly/README.md
          git commit -m "Add monthly industry trading dashboard"
          git push origin HEAD:main
