name: Repair Append-Only News History v3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-news-retention-v3.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  recover-wrap-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 전체 Git 이력과 최신 main 불러오기
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Python 준비
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 뉴스 보존키 보수화
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/news_retention.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "    if title:\n"
              "        source = clean_text(item.get(\"source\")).lower()\n"
              "        keys.append(f\"source-title|{source}|{title}\")\n"
          )
          if old in text:
              path.write_text(text.replace(old, "", 1), encoding="utf-8")
          elif "source-title|" in text:
              raise SystemExit("뉴스 보존키를 안전하게 수정하지 못했습니다.")
          PY

      - name: Git 이력에서 뉴스 전체 복구
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/news_retention.py
          python scripts/news_retention.py --self-test
          python scripts/news_retention.py \
            --recover-git-history \
            --maximum-commits 300 \
            2>&1 | tee /tmp/news-retention.log

      - name: 기존 수집기를 core로 보존하고 append-only 래퍼 설치
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f scripts/sync_policies_core.py ]]; then
            mv scripts/sync_policies.py scripts/sync_policies_core.py
          fi
          cat > scripts/sync_policies.py <<'PY'
          #!/usr/bin/env python3
          """Policy collector compatibility module with append-only news retention."""
          from __future__ import annotations

          from sync_policies_core import *  # noqa: F401,F403
          import sync_policies_core as _core
          import news_retention as _retention


          def main() -> int:
              result = _core.main()
              if result not in (None, 0):
                  return int(result)
              audit = _retention.run(
                  _retention.POLICY_PATH,
                  _retention.HISTORY_PATH,
                  _retention.AUDIT_PATH,
                  _retention.SETTINGS_PATH,
                  recover=False,
                  maximum_commits=1,
              )
              print(
                  "APPEND_ONLY_NEWS_RETAINED="
                  + str(audit["counts"]["finalNewsCount"])
              )
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          cat > scripts/sync_policies_retained.py <<'PY'
          #!/usr/bin/env python3
          """Backward-compatible entry point for the retained policy collector."""
          from sync_policies import main

          if __name__ == "__main__":
              raise SystemExit(main())
          PY

      - name: 래퍼 호환성과 복구 데이터 검증
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/sync_policies.py \
            scripts/sync_policies_core.py \
            scripts/sync_policies_retained.py \
            scripts/news_retention.py
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import sync_policies

          for name in ("source_section", "category_for", "clean_html", "main"):
              if not hasattr(sync_policies, name):
                  raise SystemExit(f"수집기 호환 함수 누락: {name}")

          policies = json.loads(Path("public/data/policies.json").read_text(encoding="utf-8"))
          history = json.loads(Path("public/data/news-history.json").read_text(encoding="utf-8"))
          audit = json.loads(Path("public/data/news-retention-audit.json").read_text(encoding="utf-8"))
          news = [item for item in policies.get("items", []) if item.get("sourceType") == "news" or item.get("section") == "news"]
          final_count = int(audit["counts"]["finalNewsCount"])
          archive_count = int(history.get("itemCount", -1))
          historical = int(audit.get("historicalMaxSnapshotCount", -1))
          floor = int(audit.get("safetyFloor", -1))
          if audit.get("status") != "verified":
              raise SystemExit("뉴스 감사상태가 verified가 아닙니다.")
          if len(news) != final_count or archive_count != final_count:
              raise SystemExit(f"뉴스 건수 불일치: {len(news)}/{archive_count}/{final_count}")
          if final_count < max(373, historical, floor):
              raise SystemExit(f"뉴스 감소 복구 실패: {final_count}/{historical}/{floor}")
          print(
              f"NEWS_RECOVERY_VERIFIED current={audit['counts']['currentPoliciesNewsBefore']} "
              f"archive={audit['counts']['archiveRowsBefore']} historical={historical} final={final_count}"
          )
          PY

      - name: 복구 데이터와 수집기 래퍼를 main에 저장
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            scripts/news_retention.py \
            scripts/sync_policies.py \
            scripts/sync_policies_core.py \
            scripts/sync_policies_retained.py \
            public/data/policies.json \
            public/data/news-history.json \
            public/data/news-retention-audit.json
          git commit -m "fix: restore and permanently retain all collected news"

          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep $((attempt * 4))
          done
          [[ "$pushed" -eq 1 ]]

      - name: 최신 main 배포원본 정렬
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            git merge --ff-only origin/main
          fi
          test -z "$(git status --porcelain)"

      - name: 공개 검증용 해시
        id: hashes
        shell: bash
        run: |
          set -euo pipefail
          echo "policies=$(sha256sum public/data/policies.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "history=$(sha256sum public/data/news-history.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "audit=$(sha256sum public/data/news-retention-audit.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Pages 설정
        uses: actions/configure-pages@v6

      - name: 공개파일 묶기
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5

      - name: 공개본 검증
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          POLICIES_SHA: ${{ steps.hashes.outputs.policies }}
          HISTORY_SHA: ${{ steps.hashes.outputs.history }}
          AUDIT_SHA: ${{ steps.hashes.outputs.audit }}
        run: |
          set -euo pipefail
          root="${PAGE_URL%/}"
          verify() {
            local file="$1" expected="$2" output
            output="$(mktemp)"
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl -fsSL --max-time 60 -H "Cache-Control: no-cache" \
                "${root}/data/${file}?verify=${GITHUB_RUN_ID}-${attempt}" -o "$output"; then
                actual="$(sha256sum "$output" | awk '{print $1}')"
                if [[ "$actual" == "$expected" ]]; then
                  rm -f "$output"
                  return 0
                fi
              fi
              sleep 8
            done
            rm -f "$output"
            return 1
          }
          verify "policies.json" "$POLICIES_SHA"
          verify "news-history.json" "$HISTORY_SHA"
          verify "news-retention-audit.json" "$AUDIT_SHA"
          curl -fsSL --max-time 60 \
            "${root}/data/news-retention-audit.json?count=${GITHUB_RUN_ID}" \
            -o /tmp/audit.json
          python - <<'PY'
          import json
          audit = json.load(open("/tmp/audit.json", encoding="utf-8"))
          final_count = int(audit["counts"]["finalNewsCount"])
          if audit.get("status") != "verified" or final_count < 373:
              raise SystemExit(f"공개본 검증 실패: {audit}")
          print(f"PUBLIC_NEWS_RECOVERY_VERIFIED={final_count}")
          PY
