name: Refresh Full Policy History and Excel

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-full-policy-and-excel.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  rebuild-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 최신 main 불러오기
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Python 준비
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 전체 공식이력과 524건 뉴스 병합
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import news_retention

          policy_path = Path("public/data/policies.json")
          climate_path = Path("public/data/policy-official-history.json")
          motie_path = Path("public/data/motie-policy-history.json")
          history_path = Path("public/data/news-history.json")

          policy = json.loads(policy_path.read_text(encoding="utf-8"))
          climate = json.loads(climate_path.read_text(encoding="utf-8"))
          motie = json.loads(motie_path.read_text(encoding="utf-8"))
          news_history = json.loads(history_path.read_text(encoding="utf-8"))

          official_sections = {"press", "notice", "motie_press", "motie_notice", "krx_notice"}
          official_index = {}

          def official_key(item):
              section = str(item.get("section") or "").strip().lower()
              source_id = str(item.get("sourceId") or item.get("id") or "").strip()
              if source_id:
                  return f"{section}|id|{source_id}"
              url = str(item.get("url") or "").strip()
              if url:
                  return f"{section}|url|{url}"
              title = re.sub(r"[^0-9a-z가-힣]+", "", str(item.get("title") or "").lower())
              return f"{section}|date-title|{item.get('publishedAt','')}|{title}"

          for document in (climate, motie):
              for raw in document.get("items", []):
                  if not isinstance(raw, dict) or raw.get("section") not in official_sections:
                      continue
                  official_index[official_key(raw)] = raw

          news_index = news_retention.NewsIndex()
          for document in (news_history, policy):
              for raw in document.get("items", []):
                  if news_retention.is_valid_news(raw):
                      news_index.add(raw)
          news = news_retention.sort_news(news_index.values())

          other = [
              raw for raw in policy.get("items", [])
              if isinstance(raw, dict)
              and raw.get("section") not in official_sections
              and not news_retention.is_news(raw)
          ]
          official = list(official_index.values())
          combined = [*official, *news, *other]
          combined.sort(
              key=lambda item: (
                  str(item.get("publishedAt") or item.get("date") or "")[:10],
                  str(item.get("title") or ""),
              ),
              reverse=True,
          )
          policy["items"] = combined
          policy["newsRetention"] = {
              "policy": "append-only",
              "itemCount": len(news),
              "archiveItemCount": int(news_history.get("itemCount", 0)),
              "status": "verified",
          }
          policy["officialHistoryMerge"] = {
              "status": "verified",
              "itemCount": len(official),
              "sources": [climate_path.name, motie_path.name],
          }

          section_counts = {
              section: sum(1 for item in official if item.get("section") == section)
              for section in sorted(official_sections)
          }
          expected_news = int(news_history.get("itemCount", -1))
          if len(news) != expected_news or expected_news != 524:
              raise SystemExit(f"뉴스 병합건수 오류: unique={len(news)}, archive={expected_news}")
          if any(value <= 0 for value in section_counts.values()):
              raise SystemExit(f"공식자료 탭 누락: {section_counts}")

          content = json.dumps(policy, ensure_ascii=False, indent=2) + "\n"
          with tempfile.NamedTemporaryFile(
              mode="w", encoding="utf-8", dir=policy_path.parent, delete=False, suffix=".tmp"
          ) as handle:
              handle.write(content)
              temporary = Path(handle.name)
          temporary.replace(policy_path)
          print(
              "FULL_POLICY_REBUILD="
              + json.dumps(
                  {
                      "official": len(official),
                      "news": len(news),
                      "other": len(other),
                      "total": len(combined),
                      "sectionCounts": section_counts,
                      "sha256": hashlib.sha256(content.encode("utf-8")).hexdigest(),
                  },
                  ensure_ascii=False,
              )
          )
          PY

      - name: 호환 엑셀 템플릿 조립
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/policy_excel_template_lines/part*.b64 > /tmp/policy_excel_template.b64
          python -m py_compile scripts/export_policy_radar_excel.py scripts/export_policy_radar_excel_compatible.py

      - name: 전체 엑셀 재생성
        shell: bash
        run: |
          set -euo pipefail
          python scripts/export_policy_radar_excel_compatible.py \
            --policy-path public/data/policies.json \
            --bill-path public/data/bills.json \
            --seminar-path public/data/assembly_seminars.json \
            --template-b64 /tmp/policy_excel_template.b64 \
            --output public/data/ets-policy-radar-events.xlsx \
            --fixed-output public/data/ets-policy-radar-events-fixed.xlsx \
            --manifest public/data/policy-radar-excel.json

      - name: 최종 건수와 XLSX 검증
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path
          from xml.etree import ElementTree as ET

          manifest = json.loads(Path("public/data/policy-radar-excel.json").read_text(encoding="utf-8"))
          expected = {
              "기후부 보도자료": 916,
              "기후부 공지사항": 421,
              "산업부 보도자료": 1882,
              "산업부 공지사항": 950,
              "한국거래소 공지사항": 312,
              "뉴스": 524,
          }
          counts = manifest.get("counts") or {}
          errors = {key: (counts.get(key), value) for key, value in expected.items() if int(counts.get(key, -1)) != value}
          if errors:
              raise SystemExit(f"엑셀 탭별 건수 오류: {errors}")
          if manifest.get("generator") != "artifact_tool-template-v2" or int(manifest.get("sheetCount", 0)) != 11:
              raise SystemExit(f"호환 엑셀 생성정보 오류: {manifest}")
          for file_name in ("ets-policy-radar-events.xlsx", "ets-policy-radar-events-fixed.xlsx"):
              path = Path("public/data") / file_name
              with zipfile.ZipFile(path) as archive:
                  if archive.testzip() is not None:
                      raise SystemExit(f"XLSX ZIP 오류: {file_name}")
                  for name in archive.namelist():
                      if name.endswith((".xml", ".rels")):
                          ET.fromstring(archive.read(name))
          print(f"FULL_EXCEL_VERIFIED total={manifest['totalEventCount']} news={counts['뉴스']}")
          PY

      - name: 데이터와 엑셀을 main에 저장
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            public/data/policies.json \
            public/data/ets-policy-radar-events.xlsx \
            public/data/ets-policy-radar-events-fixed.xlsx \
            public/data/policy-radar-excel.json
          git commit -m "data: restore full policy history and 524 news items"
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep $((attempt * 4))
          done
          [[ "$pushed" -eq 1 ]]

      - name: 최신 main 정렬
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            git merge --ff-only origin/main
          fi
          test -z "$(git status --porcelain)"

      - name: 공개검증 해시
        id: hashes
        shell: bash
        run: |
          set -euo pipefail
          echo "policies=$(sha256sum public/data/policies.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "excel=$(sha256sum public/data/ets-policy-radar-events-fixed.xlsx | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "manifest=$(sha256sum public/data/policy-radar-excel.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5

      - name: 공개 데이터 검증
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          POLICIES_SHA: ${{ steps.hashes.outputs.policies }}
          EXCEL_SHA: ${{ steps.hashes.outputs.excel }}
          MANIFEST_SHA: ${{ steps.hashes.outputs.manifest }}
        run: |
          set -euo pipefail
          root="${PAGE_URL%/}"
          verify() {
            local file="$1" expected="$2" output
            output="$(mktemp)"
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl -fsSL --max-time 60 -H "Cache-Control: no-cache" \
                "${root}/data/${file}?verify=${GITHUB_RUN_ID}-${attempt}" -o "$output"; then
                actual="$(sha256sum "$output" | awk '{print $1}')"
                if [[ "$actual" == "$expected" ]]; then rm -f "$output"; return 0; fi
              fi
              sleep 8
            done
            rm -f "$output"
            return 1
          }
          verify "policies.json" "$POLICIES_SHA"
          verify "ets-policy-radar-events-fixed.xlsx" "$EXCEL_SHA"
          verify "policy-radar-excel.json" "$MANIFEST_SHA"
          curl -fsSL --max-time 60 "${root}/data/policy-radar-excel.json?count=${GITHUB_RUN_ID}" -o /tmp/manifest.json
          python - <<'PY'
          import json
          manifest = json.load(open("/tmp/manifest.json", encoding="utf-8"))
          if int(manifest["counts"]["뉴스"]) != 524:
              raise SystemExit(f"공개 엑셀 뉴스 건수 오류: {manifest['counts']['뉴스']}")
          print(f"PUBLIC_FULL_POLICY_EXCEL_VERIFIED total={manifest['totalEventCount']} news=524")
          PY
