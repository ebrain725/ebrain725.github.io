name: One-shot KRX backfill batch 2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-krx-backfill-batch-2.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trigger commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Confirm this is the one-time file addition
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          trigger_path=".github/workflows/one-shot-krx-backfill-batch-2.yml"
          if git diff-tree --root --no-commit-id --name-only --diff-filter=A \
            -r "$GITHUB_SHA" -- "$trigger_path" | grep -Fxq "$trigger_path"; then
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
          else
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "최초 파일 추가가 아니므로 수집을 호출하지 않습니다."
          fi

      - name: Dispatch one bounded KRX backfill batch
        if: steps.guard.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run sync-krx-daily-trends.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --raw-field mode=backfill \
            --raw-field backfill_pages=20
