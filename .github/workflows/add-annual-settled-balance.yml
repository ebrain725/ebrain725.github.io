name: Add annual settled balance column

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/add-annual-settled-balance.yml"

permissions:
  contents: write

jobs:
  update-annual-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply settled balance patch
        run: python scripts/add_annual_settled_balance_once.py

      - name: Validate JavaScript syntax
        run: node --check public/assets/krx-annual-balance-v2.js

      - name: Commit dashboard changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/krx-annual.html public/assets/krx-annual-balance-v2.js public/assets/krx-annual-balance-v2.css
          git commit -m "Add annual settled balance column"
          git push origin HEAD:main
