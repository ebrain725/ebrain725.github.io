name: Sync KRX Market & Auction Data v3

on:
  schedule:
    # KRX 전일 데이터 갱신(08:00 KST) 이후 매일 08:37 KST 실행
    - cron: "37 23 * * *"
    # KRX 배출권시장 종료 후 당일 시세를 12:07 KST에 반영 (평일)
    - cron: "7 3 * * 1-5"
    # 매주 수요일 17:17 KST 호출 후 둘째 주(8~14일)에만 경매 수집
    - cron: "17 8 * * 3"
  workflow_dispatch:
    inputs:
      mode:
        description: "수집 방식"
        required: true
        default: "site-today"
        type: choice
        options:
          - site-today
          - openapi
          - auction
      target_date:
        description: "Open API 전용: 조회 기준일 YYYY-MM-DD (비우면 전일)"
        required: false
        type: string
      trigger_type:
        description: "실행 주체"
        required: true
        default: "manual"
        type: choice
        options:
          - manual
          - scheduler

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
      KAU_SYMBOL: ${{ vars.KAU_SYMBOL }}
      KRX_TARGET_DATE: ${{ inputs.target_date }}
      KRX_AUCTION_START_DATE: "2015-01-01"
      TZ: Asia/Seoul
    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4
      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집 방식 결정
        id: mode_check
        shell: bash
        run: |
          MODE="${{ inputs.mode }}"
          TRIGGER_TYPE="${{ inputs.trigger_type }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TRIGGER_TYPE="scheduler"
            if [ "${{ github.event.schedule }}" = "7 3 * * 1-5" ]; then
              MODE="site-today"
            elif [ "${{ github.event.schedule }}" = "17 8 * * 3" ]; then
              MODE="auction"
            else
              MODE="openapi"
            fi
          fi
          if [ -z "$MODE" ]; then
            MODE="site-today"
          fi
          echo "KRX_SYNC_MODE=$MODE" >> "$GITHUB_ENV"
          echo "SHOULD_RUN=true" >> "$GITHUB_ENV"

          # 외부 cron-job.org는 매주 수요일 호출하고, 여기서 둘째 주만 통과시킵니다.
          if [ "$MODE" = "auction" ] && [ "$TRIGGER_TYPE" = "scheduler" ]; then
            DAY_OF_MONTH=$(TZ=Asia/Seoul date +%d)
            DAY_OF_WEEK=$(TZ=Asia/Seoul date +%u)
            HOUR=$(TZ=Asia/Seoul date +%H)
            if [ "$DAY_OF_WEEK" != "3" ] || [ "$((10#$DAY_OF_MONTH))" -lt 8 ] || [ "$((10#$DAY_OF_MONTH))" -gt 14 ] || [ "$((10#$HOUR))" -lt 17 ]; then
              echo "SHOULD_RUN=false" >> "$GITHUB_ENV"
              echo "경매 수집 생략: 둘째 주 수요일 17시 이후가 아닙니다."
            fi
          fi
          echo "수집 방식: $MODE"
      - name: KRX 배출권 시세·경매 수집
        if: env.SHOULD_RUN == 'true'
        run: python scripts/sync_krx.py
      - name: 변경된 시세·경매 저장
        if: env.SHOULD_RUN == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/prices.csv public/data/auctions.json
          if git diff --cached --quiet; then
            echo "새로운 KRX 시세 또는 경매 결과가 없습니다."
          else
            git commit -m "data: update KRX emissions market and auction"
            git push
          fi
      - name: Pages 설정
        uses: actions/configure-pages@v5
      - name: 공개 파일 묶기
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
