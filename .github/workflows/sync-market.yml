name: Sync KRX Market Data

on:
  schedule:
    # 매일 한국시간 08:37 실행
    - cron: "37 23 * * *"

  workflow_dispatch:
    inputs:
      target_date:
        description: "선택: 조회 기준일 YYYY-MM-DD (비우면 전일)"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
      KAU_SYMBOL: ${{ vars.KAU_SYMBOL }}
      KRX_TARGET_DATE: ${{ inputs.target_date }}
      TZ: Asia/Seoul

    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: KRX 배출권 시세 수집
        run: python scripts/sync_krx.py

      - name: 변경된 시세 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/prices.csv
          if git diff --cached --quiet; then
            echo "새로운 KRX 시세가 없습니다."
          else
            git commit -m "data: update KRX emissions market"
            git push
          fi

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 공개 파일 묶기
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
