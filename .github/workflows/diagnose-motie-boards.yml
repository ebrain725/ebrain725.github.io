name: Diagnose MOTIE Boards

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-motie-boards.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: press
            url: https://www.motir.go.kr/kor/article/ATCL3f49a5a8c
          - label: notice
            url: https://www.motir.go.kr/kor/article/ATCL6e90bb9de
    steps:
      - name: Probe board HTML
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          TARGET_URL: ${{ matrix.url }}
        run: |
          set -euo pipefail
          out="/tmp/${LABEL}.html"
          curl -L --compressed --connect-timeout 15 --max-time 90 --retry 2 --retry-all-errors \
            -A 'Mozilla/5.0 (compatible; ETS-LIVE-DASHBOARD/5.0)' \
            -H 'Accept: text/html,application/xhtml+xml' \
            -o "$out" "$TARGET_URL"
          python - "$out" <<'PY'
          import html, re, sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          print('bytes=', len(text.encode('utf-8')))
          print('title=', re.sub(r'\s+', ' ', html.unescape((re.search(r'<title[^>]*>(.*?)</title>', text, re.I|re.S) or [None,''])[1])).strip())
          for form in re.findall(r'<form\b.*?</form>', text, re.I|re.S):
              if any(token in form for token in ('pageIndex', 'search', 'searchCondition', 'searchKeyword', 'startDate', 'endDate')):
                  print('--- FORM ---')
                  print(re.sub(r'\s+', ' ', html.unescape(form))[:8000])
          print('--- INPUTS ---')
          for tag in re.findall(r'<(?:input|select|option)\b[^>]*>', text, re.I):
              decoded = html.unescape(tag)
              if any(token.lower() in decoded.lower() for token in ('page', 'search', 'date', 'category', 'rss', 'article')):
                  print(re.sub(r'\s+', ' ', decoded)[:500])
          print('--- LINKS ---')
          links=[]
          for href, body in re.findall(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', text, re.I|re.S):
              label=re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',html.unescape(body))).strip()
              target=html.unescape(href)
              if any(token in target for token in ('pageIndex', '/rss', '/view', 'ATCL')) or 'RSS' in label.upper():
                  links.append((label,target))
          for item in links[:80]: print(item)
          PY
