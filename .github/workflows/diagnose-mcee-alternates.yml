name: Diagnose MCEE Alternate Hosts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-mcee-alternates.yml"

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: mcee-bare-web
            url: "https://mcee.go.kr/home/web/board/list.do?boardMasterId=1&menuId=286&maxIndexPages=10&maxPageItems=10&pagerOffset=0&searchKey=titleOrContent&searchValue=%EB%B0%B0%EC%B6%9C%EA%B6%8C"
          - label: me-www-web
            url: "https://www.me.go.kr/home/web/board/list.do?boardMasterId=1&menuId=286&maxIndexPages=10&maxPageItems=10&pagerOffset=0&searchKey=titleOrContent&searchValue=%EB%B0%B0%EC%B6%9C%EA%B6%8C"
          - label: me-bare-web
            url: "https://me.go.kr/home/web/board/list.do?boardMasterId=1&menuId=286&maxIndexPages=10&maxPageItems=10&pagerOffset=0&searchKey=titleOrContent&searchValue=%EB%B0%B0%EC%B6%9C%EA%B6%8C"
          - label: mcee-www-mobile
            url: "https://www.mcee.go.kr/home/mob/board/list.do?boardMasterId=1&menuId=286&maxIndexPages=10&maxPageItems=10&pagerOffset=0&searchKey=titleOrContent&searchValue=%EB%B0%B0%EC%B6%9C%EA%B6%8C"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe ${{ matrix.label }}
        shell: bash
        env:
          TARGET_URL: ${{ matrix.url }}
          LABEL: ${{ matrix.label }}
        run: |
          set -u
          output="/tmp/${LABEL}.html"
          set +e
          code="$(curl -4 --http1.1 --location --compressed \
            --connect-timeout 10 --max-time 40 --retry 1 --retry-all-errors \
            --user-agent 'Mozilla/5.0 (compatible; ETS-LIVE-DASHBOARD/4.0)' \
            --silent --show-error --output "$output" --write-out '%{http_code}' "$TARGET_URL")"
          status=$?
          set -e
          bytes=0
          [[ -f "$output" ]] && bytes="$(wc -c < "$output")"
          echo "label=${LABEL} curl_status=${status} http_code=${code} bytes=${bytes}"
          if [[ -f "$output" && "$bytes" -gt 0 ]]; then
            python - "$output" <<'PY'
          import re, sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          print('boardId_count=',len(re.findall(r'boardId',text,re.I)))
          print('read_do_count=',len(re.findall(r'board/read\\.do',text,re.I)))
          print('date_count=',len(re.findall(r'20\\d{2}[./-]\\d{1,2}[./-]\\d{1,2}',text)))
          print('prefix=',re.sub(r'\\s+',' ',text[:500]))
          PY
          fi
          exit 0
