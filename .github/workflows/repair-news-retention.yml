name: Repair Append-Only News History

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-news-retention.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  recover-patch-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 전체 Git 이력과 최신 main 불러오기
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Python 준비
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 뉴스 중복키를 보수적으로 정리
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/news_retention.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "    if title:\n"
              "        source = clean_text(item.get(\"source\")).lower()\n"
              "        keys.append(f\"source-title|{source}|{title}\")\n"
          )
          if old in text:
              text = text.replace(old, "", 1)
              path.write_text(text, encoding="utf-8")
              print("동일 출처·동일 제목만으로 다른 날짜의 뉴스를 합치지 않도록 수정했습니다.")
          elif "source-title|" in text:
              raise SystemExit("source-title 중복키를 안전하게 제거하지 못했습니다.")
          else:
              print("보수적 뉴스 중복키가 이미 적용돼 있습니다.")
          PY

      - name: 뉴스 보존 모듈 자체검증
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/news_retention.py \
            scripts/sync_policies_retained.py \
            scripts/patch_sync_policies_news_retention.py
          python scripts/news_retention.py --self-test

      - name: Git 이력에서 전체 뉴스 복구·병합
        shell: bash
        run: |
          set -euo pipefail
          python scripts/news_retention.py \
            --recover-git-history \
            --maximum-commits 300 \
            2>&1 | tee /tmp/news-retention.log

      - name: 일일 정책수집을 append-only 방식으로 교체
        shell: bash
        run: |
          set -euo pipefail
          python scripts/patch_sync_policies_news_retention.py
          python scripts/patch_sync_policies_news_retention.py --check

      - name: 복구 결과 검증
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path("public/data/policies.json").read_text(encoding="utf-8"))
          history = json.loads(Path("public/data/news-history.json").read_text(encoding="utf-8"))
          audit = json.loads(Path("public/data/news-retention-audit.json").read_text(encoding="utf-8"))
          news = [
              item for item in policy.get("items", [])
              if item.get("sourceType") == "news" or item.get("section") == "news"
          ]
          final_count = int((audit.get("counts") or {}).get("finalNewsCount", -1))
          safety_floor = int(audit.get("safetyFloor", -1))
          historical_max = int(audit.get("historicalMaxSnapshotCount", 0))
          archive_count = int(history.get("itemCount", -1))
          if audit.get("status") != "verified":
              raise SystemExit("뉴스 보존 감사상태가 verified가 아닙니다.")
          if len(news) != final_count or archive_count != final_count:
              raise SystemExit(
                  f"뉴스 건수 불일치: policies={len(news)}, archive={archive_count}, audit={final_count}"
              )
          if final_count < safety_floor or final_count < historical_max or final_count < 373:
              raise SystemExit(
                  f"뉴스 감소 복구 실패: final={final_count}, floor={safety_floor}, historical={historical_max}"
              )
          workflow = Path(".github/workflows/sync-policies.yml").read_text(encoding="utf-8")
          required = (
              "python scripts/sync_policies_retained.py",
              "public/data/news-history.json",
              "public/data/news-retention-audit.json",
              "뉴스 보관파일 건수 확인",
              "35_000_000",
          )
          missing = [marker for marker in required if marker not in workflow]
          if missing:
              raise SystemExit(f"일일 워크플로 영구패치 누락: {missing}")
          print(
              f"뉴스 복구 검증 완료: 현재 {audit['counts']['currentPoliciesNewsBefore']}건, "
              f"기존 보관 {audit['counts']['archiveRowsBefore']}건, "
              f"역대 최대 {historical_max}건, 최종 {final_count}건"
          )
          PY

      - name: 복구 데이터와 영구 패치를 main에 저장
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/repair-news-retention.yml
          git add -- \
            scripts/news_retention.py \
            .github/workflows/sync-policies.yml \
            public/data/policies.json \
            public/data/news-history.json \
            public/data/news-retention-audit.json
          git commit -m "fix: restore and permanently retain all collected news"

          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep $((attempt * 4))
          done
          if [[ "$pushed" -ne 1 ]]; then
            exit 1
          fi

      - name: 최신 main 배포원본 정렬
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            git merge --ff-only origin/main
          fi
          test -z "$(git status --porcelain)"

      - name: 공개 검증용 해시 계산
        id: hashes
        shell: bash
        run: |
          set -euo pipefail
          echo "policies=$(sha256sum public/data/policies.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "history=$(sha256sum public/data/news-history.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "audit=$(sha256sum public/data/news-retention-audit.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Pages 설정
        uses: actions/configure-pages@v6

      - name: 전체 공개파일 묶기
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5

      - name: 공개 뉴스 건수와 파일 해시 검증
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          POLICIES_SHA: ${{ steps.hashes.outputs.policies }}
          HISTORY_SHA: ${{ steps.hashes.outputs.history }}
          AUDIT_SHA: ${{ steps.hashes.outputs.audit }}
        run: |
          set -euo pipefail
          root="${PAGE_URL%/}"
          verify() {
            local file="$1" expected="$2" output
            output="$(mktemp)"
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl -fsSL --max-time 60 -H "Cache-Control: no-cache" \
                "${root}/data/${file}?verify=${GITHUB_RUN_ID}-${attempt}" -o "$output"; then
                actual="$(sha256sum "$output" | awk '{print $1}')"
                if [[ "$actual" == "$expected" ]]; then
                  rm -f "$output"
                  return 0
                fi
              fi
              sleep 8
            done
            rm -f "$output"
            echo "::error::공개 ${file} 해시 검증 실패"
            return 1
          }
          verify "policies.json" "$POLICIES_SHA"
          verify "news-history.json" "$HISTORY_SHA"
          verify "news-retention-audit.json" "$AUDIT_SHA"

          curl -fsSL --max-time 60 \
            "${root}/data/news-retention-audit.json?count=${GITHUB_RUN_ID}" \
            -o /tmp/public-news-audit.json
          python - <<'PY'
          import json
          audit = json.load(open("/tmp/public-news-audit.json", encoding="utf-8"))
          final_count = int(audit["counts"]["finalNewsCount"])
          if audit.get("status") != "verified" or final_count < 373:
              raise SystemExit(f"공개 뉴스 복구 검증 실패: {audit}")
          print(f"공개 뉴스 복구 확인 완료: {final_count}건")
          PY
