name: Merge Complete Official Policy History

on:
  workflow_run:
    workflows: ["Sync Ministry Policies"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/triggers/official-policy-history-merge.txt"
      - ".github/workflows/merge-official-policy-history.yml"
      - "scripts/sync_climate_policy_expanded.py"
      - "config/motie_policy_keywords.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  merge-history:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: 저장소 최신본 불러오기
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Python 준비
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 기후부 확대 키워드 이력 갱신
        shell: bash
        run: |
          set -euo pipefail
          test -f public/data/policy-official-history.json || {
            echo "::error::기후부·거래소 공식자료 전체 이력이 없습니다."
            exit 1
          }
          test -f public/data/policies.json || {
            echo "::error::public/data/policies.json이 없습니다."
            exit 1
          }
          test -f config/motie_policy_keywords.json || {
            echo "::error::산업부와 공유할 30개 키워드 설정이 없습니다."
            exit 1
          }

          python -m py_compile \
            scripts/sync_climate_policy_expanded.py \
            scripts/merge_official_policy_history.py \
            scripts/sync_motie_official_history.py \
            scripts/backfill_official_policy_history.py \
            scripts/backfill_official_policy_history_v2.py \
            scripts/sync_policies.py
          python scripts/sync_climate_policy_expanded.py --self-test

          # 산업부 자료는 다음 전용 워크플로가 다시 병합한다. 기후부 병합 과정에서
          # 산업부 항목이 기후부 공지로 오분류되지 않도록 먼저 분리한다.
          python scripts/sync_motie_official_history.py --remove-from-policy

          full=false
          if ! python - <<'PY'
          import json
          from pathlib import Path

          history = json.loads(
              Path("public/data/policy-official-history.json").read_text(encoding="utf-8")
          )
          marker = history.get("climateKeywordExpansion") or {}
          raise SystemExit(
              0
              if marker.get("version") == "2026-09-09-v1-shared-30-keywords"
              else 1
          )
          PY
          then
            full=true
          fi

          if [[ "$full" == "true" ]]; then
            echo "기후부 보도자료·공지사항을 2015-01-01부터 30개 키워드로 전수 재수집합니다."
            python scripts/sync_climate_policy_expanded.py \
              --start-date 2015-01-01 \
              --full
          else
            echo "기후부 확대 키워드 이력을 최근 60일 범위로 증분 갱신합니다."
            python scripts/sync_climate_policy_expanded.py \
              --start-date 2015-01-01 \
              --lookback-days 60
          fi

      - name: 확대 이력과 대시보드 병합 검증
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import urllib.parse
          from pathlib import Path

          history_path = Path("public/data/policy-official-history.json")
          policy_path = Path("public/data/policies.json")
          summary_path = Path("public/data/policy-official-history-summary.json")
          keyword_path = Path("config/motie_policy_keywords.json")
          for path in (history_path, policy_path, summary_path, keyword_path):
              if not path.is_file():
                  raise SystemExit(f"필수 파일이 없습니다: {path}")
          if history_path.stat().st_size > 20_000_000 or policy_path.stat().st_size > 20_000_000:
              raise SystemExit("기후부 확대 데이터 파일이 비정상적으로 큽니다.")

          history = json.loads(history_path.read_text(encoding="utf-8"))
          policies = json.loads(policy_path.read_text(encoding="utf-8"))
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          keyword_config = json.loads(keyword_path.read_text(encoding="utf-8"))
          marker = history.get("climateKeywordExpansion") or {}
          if marker.get("version") != "2026-09-09-v1-shared-30-keywords":
              raise SystemExit(f"기후부 확대 버전이 올바르지 않습니다: {marker}")
          rule = marker.get("keywordRule") or {}
          if rule.get("titleAndContent") != keyword_config.get("titleAndContent"):
              raise SystemExit("기후부 핵심 키워드가 산업부 설정과 다릅니다.")
          if rule.get("titleOnly") != keyword_config.get("titleOnly"):
              raise SystemExit("기후부 확대 키워드가 산업부 설정과 다릅니다.")
          if len(rule.get("titleAndContent", [])) != 7 or len(rule.get("titleOnly", [])) != 23:
              raise SystemExit("기후부 키워드 수가 핵심 7개·확대 23개가 아닙니다.")

          items = history.get("items", [])
          coverage = history.get("coverage") or {}
          counts = coverage.get("counts") or {}
          direct = coverage.get("directCounts") or {}
          related = coverage.get("relatedCounts") or {}
          required = {"press", "notice", "krx_notice"}
          if set(counts) != required:
              raise SystemExit(f"공식자료 구분이 올바르지 않습니다: {counts}")
          if int(counts.get("press", 0)) < 272:
              raise SystemExit(f"기후부 보도자료가 기존 이력보다 감소했습니다: {counts}")
          if int(counts.get("notice", 0)) < 210:
              raise SystemExit(f"기후부 공지사항이 기존 이력보다 감소했습니다: {counts}")
          if int(counts.get("krx_notice", 0)) < 312:
              raise SystemExit(f"한국거래소 이력이 감소했습니다: {counts}")
          if int(related.get("press", 0)) <= 0 or int(related.get("notice", 0)) <= 0:
              raise SystemExit(f"확대 23개 키워드로 추가된 기후부 자료가 없습니다: {related}")
          if int(direct.get("press", 0)) <= 0 or int(direct.get("notice", 0)) <= 0:
              raise SystemExit(f"기본 7개 키워드 자료가 비었습니다: {direct}")
          if history.get("requestedStartDate") != "2015-01-01":
              raise SystemExit("공식자료 기준일이 2015-01-01이 아닙니다.")

          seen = set()
          climate_hosts = {"mcee.go.kr", "www.mcee.go.kr"}
          for index, item in enumerate(items):
              section = str(item.get("section", ""))
              published = str(item.get("publishedAt", ""))[:10]
              if section not in required:
                  raise SystemExit(f"items[{index}] section 오류: {section}")
              if not re.fullmatch(r"20\d{2}-\d{2}-\d{2}", published) or published < "2015-01-01":
                  raise SystemExit(f"items[{index}] 게시일 오류: {published}")
              url = str(item.get("url", ""))
              host = (urllib.parse.urlsplit(url).hostname or "").lower()
              if section in {"press", "notice"}:
                  if host not in climate_hosts:
                      raise SystemExit(f"기후부 공식 도메인 오류: {host}")
                  if not item.get("matchedKeywords"):
                      raise SystemExit(f"기후부 항목에 일치 키워드가 없습니다: {index}")
                  key = f"{section}|{url or published + '|' + str(item.get('title', ''))}"
              else:
                  key = f"krx_notice|{item.get('sourceId') or item.get('id')}"
              if key in seen:
                  raise SystemExit(f"공식자료 중복: {key}")
              seen.add(key)

          current_official = [
              item for item in policies.get("items", [])
              if item.get("sourceType") != "news"
          ]
          if any(item.get("section") in {"motie_press", "motie_notice"} for item in current_official):
              raise SystemExit("기후부 병합 단계에 산업부 항목이 남아 있습니다.")
          if len(current_official) != len(items):
              raise SystemExit(
                  f"대시보드 공식자료 {len(current_official)}건과 이력 {len(items)}건이 다릅니다."
              )
          if summary.get("keywordExpansionVersion") != marker.get("version"):
              raise SystemExit("공식자료 요약의 확대 버전이 일치하지 않습니다.")
          if summary.get("counts") != counts:
              raise SystemExit("공식자료 요약 건수가 전체 이력과 다릅니다.")

          audits = [
              audit for audit in history.get("sourceAudit", [])
              if isinstance(audit, dict) and audit.get("section") in {"press", "notice"}
          ]
          if {audit.get("section") for audit in audits} != {"press", "notice"}:
              raise SystemExit("기후부 보도자료·공지사항 수집 감사정보가 없습니다.")
          if any(audit.get("complete") is not True for audit in audits):
              raise SystemExit(f"기후부 확대 수집이 완전하지 않습니다: {audits}")

          print(
              "기후부 확대 이력 검증 완료: "
              f"보도자료 {counts['press']}건(직접 {direct['press']} / 연관 {related['press']}), "
              f"공지사항 {counts['notice']}건(직접 {direct['notice']} / 연관 {related['notice']}), "
              f"KRX {counts['krx_notice']}건"
          )
          PY

      - name: 확대 이력 파일 저장
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/data/policies.json \
            public/data/policy-official-history.json \
            public/data/policy-official-history-summary.json

          if git diff --cached --quiet; then
            echo "기후부 확대 공식자료 이력에 변경이 없습니다."
          else
            git commit -m "data: expand climate ministry policy history"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "기후부 확대 공식자료 이력 저장 완료"
                break
              fi
              echo "동시 업데이트 감지: ${attempt}/3 재시도"
              git rebase --abort 2>/dev/null || true
              if [[ "$attempt" -eq 3 ]]; then
                echo "::error::기후부 확대 이력 저장에 실패했습니다."
                exit 1
              fi
              sleep $((attempt * 3))
            done
          fi

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 전체 공개 파일 묶기
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ./public

      - name: 기후부 확대 이력 포함 GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: 공개본 확대 이력 확인
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          import urllib.request

          base = "https://ebrain725.github.io"
          last_error = ""
          for attempt in range(1, 8):
              try:
                  nonce = f"{int(time.time())}-{attempt}"

                  def load(path):
                      request = urllib.request.Request(
                          f"{base}/{path}?verify={nonce}",
                          headers={"User-Agent": "ETS-LIVE-DASHBOARD/7.0"},
                      )
                      with urllib.request.urlopen(request, timeout=40) as response:
                          return json.loads(response.read().decode("utf-8"))

                  summary = load("data/policy-official-history-summary.json")
                  policies = load("data/policies.json")
                  if summary.get("keywordExpansionVersion") != "2026-09-09-v1-shared-30-keywords":
                      raise RuntimeError("공개 확대 버전이 일치하지 않습니다.")
                  counts = summary.get("counts") or {}
                  related = summary.get("relatedCounts") or {}
                  if (
                      int(counts.get("press", 0)) < 272
                      or int(counts.get("notice", 0)) < 210
                      or int(counts.get("krx_notice", 0)) < 312
                      or int(related.get("press", 0)) <= 0
                      or int(related.get("notice", 0)) <= 0
                  ):
                      raise RuntimeError(f"공개 확대 이력 건수 오류: {counts} / {related}")
                  dashboard = [
                      item for item in policies.get("items", [])
                      if item.get("section") in {"press", "notice", "krx_notice"}
                  ]
                  if len(dashboard) != sum(int(counts.get(key, 0)) for key in counts):
                      raise RuntimeError(
                          f"공개 대시보드와 요약 건수 불일치: {len(dashboard)} / {counts}"
                      )
                  print(
                      "공개 기후부 확대 이력 확인 완료: "
                      f"보도자료 {counts['press']}건 / 공지사항 {counts['notice']}건 / "
                      f"KRX {counts['krx_notice']}건"
                  )
                  break
              except Exception as exc:
                  last_error = str(exc)
              if attempt == 7:
                  raise SystemExit(f"공개 기후부 확대 이력 검증 실패: {last_error}")
              time.sleep(8)
          PY
