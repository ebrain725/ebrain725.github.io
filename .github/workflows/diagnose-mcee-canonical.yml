name: Diagnose MCEE Canonical Boards

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-mcee-canonical.yml"

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: press-direct
            url: "https://www.mcee.go.kr/home/web/board/list.do?boardMasterId=939&menuId=10598&maxIndexPages=10&maxPageItems=10&pagerOffset=0&searchKey=titleOrContent&searchValue=%EB%B0%B0%EC%B6%9C%EA%B6%8C"
          - label: notice-direct
            url: "https://www.mcee.go.kr/home/web/board/list.do?boardMasterId=39&menuId=10524&maxIndexPages=10&maxPageItems=10&pagerOffset=0&searchKey=titleOrContent&searchValue=%EB%B0%B0%EC%B6%9C%EA%B6%8C"
          - label: press-reader
            url: "https://r.jina.ai/https://www.mcee.go.kr/home/web/board/list.do?boardMasterId=939&menuId=10598&maxIndexPages=10&maxPageItems=10&pagerOffset=0&searchKey=titleOrContent&searchValue=%EB%B0%B0%EC%B6%9C%EA%B6%8C"
          - label: notice-reader
            url: "https://r.jina.ai/https://www.mcee.go.kr/home/web/board/list.do?boardMasterId=39&menuId=10524&maxIndexPages=10&maxPageItems=10&pagerOffset=0&searchKey=titleOrContent&searchValue=%EB%B0%B0%EC%B6%9C%EA%B6%8C"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe ${{ matrix.label }}
        shell: bash
        env:
          TARGET_URL: ${{ matrix.url }}
          LABEL: ${{ matrix.label }}
        run: |
          set -u
          output="/tmp/${LABEL}.txt"
          set +e
          code="$(curl -4 --http1.1 --location --compressed \
            --connect-timeout 12 --max-time 75 --retry 1 --retry-all-errors \
            --user-agent 'Mozilla/5.0 (compatible; ETS-LIVE-DASHBOARD/4.0)' \
            --silent --show-error --output "$output" --write-out '%{http_code}' "$TARGET_URL")"
          status=$?
          set -e
          bytes=0
          [[ -f "$output" ]] && bytes="$(wc -c < "$output")"
          echo "label=${LABEL} curl_status=${status} http_code=${code} bytes=${bytes}"
          if [[ -f "$output" && "$bytes" -gt 0 ]]; then
            python - "$output" <<'PY'
          import re, sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          print('boardId_count=',len(re.findall(r'boardId',text,re.I)))
          print('read_do_count=',len(re.findall(r'board/read\\.do',text,re.I)))
          print('date_count=',len(re.findall(r'20\\d{2}[./-]\\d{1,2}[./-]\\d{1,2}',text)))
          print('total_markers=',re.findall(r'총\\s*[0-9,]+\\s*건',text)[:5])
          for marker in ('board/read.do','boardId=','게시물 목록','Markdown Content'):
              pos=text.lower().find(marker.lower())
              if pos>=0:
                  print('SNIPPET',marker,':',re.sub(r'\\s+',' ',text[max(0,pos-250):pos+900])[:1150])
          print('PREFIX:',re.sub(r'\\s+',' ',text[:700]))
          PY
          fi
          exit 0
