# RETRY_VERSION = 2026-09-09-v2.1
name: Backfill Official Policy History Since 2015 v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backfill-official-policy-history-2015-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-policy-history-backfill
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 저장소 최신본 불러오기
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Python 준비
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 수집기 문법·고정 샘플 검증
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/sync_policies.py \
            scripts/merge_official_policy_history.py \
            scripts/backfill_official_policy_history.py \
            scripts/backfill_official_policy_history_v2.py
          python scripts/backfill_official_policy_history_v2.py --self-test

      - name: 2015년 이후 공식자료 전체 백필
        run: |
          set -euo pipefail
          python scripts/backfill_official_policy_history_v2.py \
            --start-date 2015-01-01 \
            2>&1 | tee /tmp/official-policy-backfill-v2.log

      - name: 전체 이력·대시보드 데이터 검증
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          history_path = Path("public/data/policy-official-history.json")
          policy_path = Path("public/data/policies.json")
          if not history_path.is_file() or not policy_path.is_file():
              raise SystemExit("백필 출력 파일이 생성되지 않았습니다.")
          if history_path.stat().st_size > 15_000_000:
              raise SystemExit("공식자료 전체 이력 파일이 15MB를 초과했습니다.")
          if policy_path.stat().st_size > 18_000_000:
              raise SystemExit("대시보드 정책 파일이 18MB를 초과했습니다.")

          history = json.loads(history_path.read_text(encoding="utf-8"))
          policies = json.loads(policy_path.read_text(encoding="utf-8"))
          if history.get("requestedStartDate") != "2015-01-01":
              raise SystemExit("백필 기준일이 2015-01-01이 아닙니다.")
          items = history.get("items")
          if not isinstance(items, list) or not items:
              raise SystemExit("공식자료 전체 이력이 비어 있습니다.")

          counts = {"press": 0, "notice": 0, "krx_notice": 0}
          dates = {key: [] for key in counts}
          seen = set()
          for index, item in enumerate(items):
              section = item.get("section")
              date = str(item.get("publishedAt", ""))[:10]
              if section not in counts:
                  raise SystemExit(f"items[{index}] section 오류: {section}")
              if date < "2015-01-01":
                  raise SystemExit(f"items[{index}] 기준일 이전 자료: {date}")
              if not item.get("title") or not item.get("source"):
                  raise SystemExit(f"items[{index}] 제목 또는 출처가 없습니다.")
              key = (
                  f"krx|{item.get('sourceId')}"
                  if section == "krx_notice"
                  else f"{section}|{item.get('url') or date + '|' + str(item.get('title'))}"
              )
              if key in seen:
                  raise SystemExit(f"중복 공식자료: {key}")
              seen.add(key)
              counts[section] += 1
              dates[section].append(date)
          if any(value <= 0 for value in counts.values()):
              raise SystemExit(f"공식자료 구분별 0건 발생: {counts}")

          audits = history.get("sourceAudit")
          if not isinstance(audits, list) or len(audits) != 3:
              raise SystemExit("3개 공식 출처의 순회 감사정보가 없습니다.")
          for audit in audits:
              if audit.get("complete") is not True:
                  raise SystemExit(f"완료되지 않은 출처 순회: {audit}")
              if audit.get("stopReason") not in {
                  "exhausted",
                  "date-boundary",
                  "boundary-repeated-page",
              }:
                  raise SystemExit(f"출처 종료 사유 오류: {audit}")
              if audit.get("section") in {"press", "notice"}:
                  if audit.get("transport") != "unfiltered-rss-local-keyword-filter":
                      raise SystemExit(f"기후부 수집 전송방식 오류: {audit}")
                  if int(audit.get("rawRows", 0)) <= int(audit.get("itemCount", 0)):
                      raise SystemExit(f"기후부 전체 RSS 순회·로컬 필터 증거가 부족합니다: {audit}")

          dashboard_official = [
              item for item in policies.get("items", [])
              if item.get("sourceType") != "news"
          ]
          if len(dashboard_official) != len(items):
              raise SystemExit(
                  f"대시보드 공식자료 {len(dashboard_official)}건과 전체 이력 {len(items)}건이 다릅니다."
              )
          metadata = policies.get("officialHistory", {})
          if int(metadata.get("itemCount", -1)) != len(items):
              raise SystemExit("대시보드 전체 이력 메타데이터가 일치하지 않습니다.")

          print(f"BACKFILL_OFFICIAL_TOTAL={len(items)}")
          print("BACKFILL_SECTION_COUNTS=" + json.dumps(counts, ensure_ascii=False))
          print("BACKFILL_EARLIEST=" + json.dumps({k: min(v) for k, v in dates.items()}, ensure_ascii=False))
          print("BACKFILL_LATEST=" + json.dumps({k: max(v) for k, v in dates.items()}, ensure_ascii=False))
          print(f"BACKFILL_HISTORY_BYTES={history_path.stat().st_size}")
          print(f"BACKFILL_POLICIES_BYTES={policy_path.stat().st_size}")
          for audit in audits:
              print("BACKFILL_SOURCE_AUDIT=" + json.dumps(audit, ensure_ascii=False))
          PY

      - name: 공식자료 전체 이력 저장
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/policies.json public/data/policy-official-history.json

          if git diff --cached --quiet; then
            echo "공식자료 전체 이력에 변경이 없습니다."
            exit 0
          fi

          git commit -m "data: backfill official policy history since 2015"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "공식자료 전체 이력 저장 완료"
              exit 0
            fi
            echo "동시 업데이트 감지: ${attempt}/3 재시도"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "::error::공식자료 전체 이력 push에 실패했습니다."
          exit 1

      - name: 백필 로그 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-policy-backfill-v2-${{ github.run_id }}
          path: /tmp/official-policy-backfill-v2.log
          if-no-files-found: ignore
          retention-days: 14
