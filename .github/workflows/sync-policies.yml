name: Sync Policy Radar

on:
  # One push run is useful whenever this workflow itself is repaired.
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-policies.yml"
  # cron-job.org continues to call this entry point.
  workflow_dispatch:
    inputs:
      trigger_type:
        description: "실행 주체(manual 또는 cron-job.org)"
        required: false
        default: "manual"
        type: string
  # Native backup: 09:35, 12:35, 15:35, 18:35, 21:35 KST.
  # A successful external run within the preceding 90 minutes makes this a no-op.
  schedule:
    - cron: "35 0,3,6,9,12 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  preflight:
    name: Check whether backup run is needed
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.freshness.outputs.skip }}
    steps:
      - name: Check out main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Check latest published timestamp
        id: freshness
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          skip = False
          age_minutes = None
          path = Path("public/data/policies.json")
          if os.getenv("EVENT_NAME") == "schedule" and path.is_file():
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
                  stamp = str(payload.get("lastSync", "")).strip()
                  parsed = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=timezone.utc)
                  age_minutes = (datetime.now(timezone.utc) - parsed.astimezone(timezone.utc)).total_seconds() / 60
                  skip = 0 <= age_minutes <= 90
              except Exception as error:
                  print(f"기존 갱신시각 판독 실패, 백업수집을 실행합니다: {error}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"skip={'true' if skip else 'false'}\n")
          print(f"BACKUP_FRESHNESS skip={skip} age_minutes={age_minutes}")
          PY

  update-and-deploy:
    name: Collect, retain, validate and deploy policy radar
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Show run source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TRIGGER_TYPE: ${{ inputs.trigger_type }}
        run: |
          set -euo pipefail
          echo "event=${EVENT_NAME} trigger=${DISPATCH_TRIGGER_TYPE:-not-dispatch}"

      - name: Check collector files and secrets
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
          NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: |
          set -euo pipefail
          for path in \
            scripts/sync_policies.py \
            scripts/sync_policies_core.py \
            scripts/news_retention.py \
            scripts/sync_bills.py \
            scripts/sync_assembly_seminars.py \
            scripts/export_policy_radar_excel.py \
            scripts/export_policy_radar_excel_compatible.py \
            config/settings.json; do
            test -f "$path" || { echo "::error::필수 파일이 없습니다: $path"; exit 1; }
          done
          test -d scripts/policy_excel_template_lines || {
            echo "::error::엑셀 템플릿 조각 폴더가 없습니다."
            exit 1
          }
          test -n "${NAVER_API_HUB_CLIENT_ID:-}" || {
            echo "::error::NAVER_API_HUB_CLIENT_ID Repository Secret이 없습니다."
            exit 1
          }
          test -n "${NAVER_API_HUB_CLIENT_SECRET:-}" || {
            echo "::error::NAVER_API_HUB_CLIENT_SECRET Repository Secret이 없습니다."
            exit 1
          }
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::warning::OPENAI_API_KEY가 없어 정책 인사이트는 기본 문구를 사용합니다."
          fi
          if [[ -z "${ASSEMBLY_API_KEY:-}" ]]; then
            echo "::warning::ASSEMBLY_API_KEY가 없어 발의법률안은 기존 데이터를 유지합니다."
          fi

      - name: Compile collectors
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/sync_policies.py \
            scripts/sync_policies_core.py \
            scripts/news_retention.py \
            scripts/sync_bills.py \
            scripts/sync_assembly_seminars.py \
            scripts/export_policy_radar_excel.py \
            scripts/export_policy_radar_excel_compatible.py
          python scripts/news_retention.py --self-test

      - name: Collect policy materials and news
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
          NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/sync_policies.py

      - name: Collect legislation without blocking radar publication
        shell: bash
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: |
          set -euo pipefail
          output="public/data/bills.json"
          if ! python scripts/sync_bills.py; then
            echo "::warning::국회 법안 수집 실패. 기존 데이터로 계속합니다."
            if git cat-file -e "HEAD:${output}" 2>/dev/null; then
              git restore --source=HEAD --worktree -- "$output"
            else
              echo "::error::복원할 기존 ${output}이 없습니다."
              exit 1
            fi
            rm -f -- "${output}.tmp"
          fi

      - name: Collect Assembly seminars without blocking radar publication
        shell: bash
        run: |
          set -euo pipefail
          output="public/data/assembly_seminars.json"
          if ! python scripts/sync_assembly_seminars.py; then
            echo "::warning::국회 세미나 수집 실패. 기존 데이터로 계속합니다."
            if git cat-file -e "HEAD:${output}" 2>/dev/null; then
              git restore --source=HEAD --worktree -- "$output"
            else
              echo "::error::복원할 기존 ${output}이 없습니다."
              exit 1
            fi
            rm -f -- "${output}.tmp"
          fi

      - name: Rebuild policy radar Excel
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/policy_excel_template_lines/part*.b64 > /tmp/policy_excel_template.b64
          python scripts/export_policy_radar_excel_compatible.py \
            --policy-path public/data/policies.json \
            --bill-path public/data/bills.json \
            --seminar-path public/data/assembly_seminars.json \
            --template-b64 /tmp/policy_excel_template.b64 \
            --output public/data/ets-policy-radar-events.xlsx \
            --fixed-output public/data/ets-policy-radar-events-fixed.xlsx \
            --manifest public/data/policy-radar-excel.json

      - name: Validate retained policy radar data
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
          NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import zipfile
          from pathlib import Path
          from xml.etree import ElementTree as ET

          data_dir = Path("public/data")
          policy_path = data_dir / "policies.json"
          history_path = data_dir / "news-history.json"
          audit_path = data_dir / "news-retention-audit.json"
          bills_path = data_dir / "bills.json"
          seminars_path = data_dir / "assembly_seminars.json"
          manifest_path = data_dir / "policy-radar-excel.json"

          for path in (policy_path, history_path, audit_path, bills_path, seminars_path, manifest_path):
              if not path.is_file():
                  raise SystemExit(f"필수 공개 데이터가 없습니다: {path}")
          if policy_path.stat().st_size > 35_000_000:
              raise SystemExit("policies.json이 35MB를 초과했습니다.")

          policy_raw = policy_path.read_text(encoding="utf-8")
          policy = json.loads(policy_raw)
          history = json.loads(history_path.read_text(encoding="utf-8"))
          audit = json.loads(audit_path.read_text(encoding="utf-8"))
          bills = json.loads(bills_path.read_text(encoding="utf-8"))
          seminars = json.loads(seminars_path.read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          items = policy.get("items")
          if not isinstance(items, list) or not items:
              raise SystemExit("정책레이더 items가 비어 있거나 배열이 아닙니다.")
          if not str(policy.get("lastSync", "")).strip():
              raise SystemExit("정책레이더 lastSync가 없습니다.")
          required = ("title", "publishedAt", "source", "sourceType")
          for index, item in enumerate(items):
              if not isinstance(item, dict):
                  raise SystemExit(f"items[{index}]가 객체가 아닙니다.")
              missing = [field for field in required if not str(item.get(field, "")).strip()]
              if missing:
                  raise SystemExit(f"items[{index}] 필수값 누락: {missing}")
              if item.get("sourceType") == "news" and not str(item.get("url", "")).strip():
                  raise SystemExit(f"items[{index}] 뉴스 URL이 없습니다.")

          news_count = sum(
              item.get("sourceType") == "news" or item.get("section") == "news"
              for item in items
          )
          non_news_count = len(items) - news_count
          archive_count = int(history.get("itemCount", -1))
          audited_count = int((audit.get("counts") or {}).get("finalNewsCount", -1))
          if audit.get("status") != "verified":
              raise SystemExit("뉴스 보존 감사상태가 verified가 아닙니다.")
          if news_count != archive_count or news_count != audited_count:
              raise SystemExit(
                  f"뉴스 보존건수 불일치: policies={news_count}, archive={archive_count}, audit={audited_count}"
              )
          retention = policy.get("policyRetention") or {}
          previous_non_news = int(retention.get("previousNonNewsCount", -1))
          if retention.get("status") != "verified" or non_news_count < previous_non_news:
              raise SystemExit(
                  f"누적 정책자료 보존 실패: current={non_news_count}, previous={previous_non_news}"
              )

          schedules = policy.get("institutionSchedules", [])
          if not isinstance(schedules, list):
              raise SystemExit("institutionSchedules가 배열이 아닙니다.")
          evidence_seen = set()
          for index, item in enumerate(schedules):
              if not isinstance(item, dict):
                  raise SystemExit(f"institutionSchedules[{index}]가 객체가 아닙니다.")
              evidence = re.sub(
                  r"[^0-9a-z가-힣]+", "", str(item.get("evidence", "")).lower()
              )[:1200]
              if len(evidence) >= 40 and evidence in evidence_seen:
                  raise SystemExit(f"institutionSchedules[{index}] 동일 본문 중복입니다.")
              if evidence:
                  evidence_seen.add(evidence)

          if not isinstance(bills, dict) or not isinstance(bills.get("items"), list):
              raise SystemExit("bills.json 구조가 올바르지 않습니다.")
          if not isinstance(seminars, dict) or not isinstance(seminars.get("items"), list):
              raise SystemExit("assembly_seminars.json 구조가 올바르지 않습니다.")
          excel_news = int((manifest.get("counts") or {}).get("뉴스", -1))
          if excel_news != news_count:
              raise SystemExit(f"엑셀 뉴스 건수 불일치: excel={excel_news}, policies={news_count}")
          if int(manifest.get("sheetCount", 0)) != 11:
              raise SystemExit("정책레이더 엑셀 시트 수가 11개가 아닙니다.")

          for file_name in ("ets-policy-radar-events.xlsx", "ets-policy-radar-events-fixed.xlsx"):
              path = data_dir / file_name
              if not path.is_file() or path.stat().st_size < 10_000:
                  raise SystemExit(f"XLSX가 없거나 비정상적으로 작습니다: {file_name}")
              with zipfile.ZipFile(path) as archive:
                  if archive.testzip() is not None:
                      raise SystemExit(f"XLSX ZIP 오류: {file_name}")
                  for member in archive.namelist():
                      if member.endswith((".xml", ".rels")):
                          ET.fromstring(archive.read(member))

          for env_name in (
              "OPENAI_API_KEY",
              "NAVER_API_HUB_CLIENT_ID",
              "NAVER_API_HUB_CLIENT_SECRET",
              "ASSEMBLY_API_KEY",
          ):
              secret = os.getenv(env_name, "")
              if secret and secret in policy_raw:
                  raise SystemExit(f"보안값이 policies.json에 포함되었습니다: {env_name}")

          print(
              "POLICY_RADAR_VALIDATED "
              f"lastSync={policy['lastSync']} total={len(items)} "
              f"news={news_count} non_news={non_news_count} schedules={len(schedules)}"
          )
          PY

      - name: Confirm only approved files changed
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          changed_paths="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          unexpected=0
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              public/data/policies.json|\
              public/data/news-history.json|\
              public/data/news-retention-audit.json|\
              public/data/bills.json|\
              public/data/assembly_seminars.json|\
              public/data/ets-policy-radar-events.xlsx|\
              public/data/ets-policy-radar-events-fixed.xlsx|\
              public/data/policy-radar-excel.json) ;;
              *) echo "::error::허용되지 않은 변경 파일: $path"; unexpected=1 ;;
            esac
          done <<< "$changed_paths"
          [[ "$unexpected" -eq 0 ]]
          if [[ -n "$changed_paths" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit policy radar outputs
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            public/data/policies.json \
            public/data/news-history.json \
            public/data/news-retention-audit.json \
            public/data/bills.json \
            public/data/assembly_seminars.json \
            public/data/ets-policy-radar-events.xlsx \
            public/data/ets-policy-radar-events-fixed.xlsx \
            public/data/policy-radar-excel.json
          git commit -m "chore(data): sync retained policy radar"

      - name: Rebase safely and push to main
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pushed=0
          for attempt in 1 2 3; do
            echo "main 반영 시도 ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::원격 main과 정책레이더 데이터 변경이 충돌했습니다."
              exit 1
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep $((attempt * 4))
          done
          [[ "$pushed" -eq 1 ]] || {
            echo "::error::3회 시도 후 main 반영에 실패했습니다."
            exit 1
          }

      - name: Align deployment source with latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain)"

      - name: Calculate public verification hashes
        id: hashes
        shell: bash
        run: |
          set -euo pipefail
          echo "policies=$(sha256sum public/data/policies.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "history=$(sha256sum public/data/news-history.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "manifest=$(sha256sum public/data/policy-radar-excel.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload complete public directory
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify deployed policy radar
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          POLICIES_SHA: ${{ steps.hashes.outputs.policies }}
          HISTORY_SHA: ${{ steps.hashes.outputs.history }}
          MANIFEST_SHA: ${{ steps.hashes.outputs.manifest }}
        run: |
          set -euo pipefail
          root="${PAGE_URL%/}"
          verify() {
            local file="$1" expected="$2" output actual
            output="$(mktemp)"
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl -fsSL --max-time 60 -H "Cache-Control: no-cache" \
                "${root}/data/${file}?verify=${GITHUB_RUN_ID}-${attempt}" -o "$output"; then
                actual="$(sha256sum "$output" | awk '{print $1}')"
                if [[ "$actual" == "$expected" ]]; then
                  rm -f "$output"
                  return 0
                fi
              fi
              sleep 8
            done
            rm -f "$output"
            return 1
          }
          verify "policies.json" "$POLICIES_SHA"
          verify "news-history.json" "$HISTORY_SHA"
          verify "policy-radar-excel.json" "$MANIFEST_SHA"
          curl -fsSL --max-time 60 \
            "${root}/data/policies.json?count=${GITHUB_RUN_ID}" -o /tmp/public-policies.json
          python - <<'PY'
          import json
          payload = json.load(open("/tmp/public-policies.json", encoding="utf-8"))
          news = sum(
              item.get("sourceType") == "news" or item.get("section") == "news"
              for item in payload.get("items", [])
          )
          print(
              f"PUBLIC_POLICY_RADAR_VERIFIED lastSync={payload.get('lastSync')} "
              f"items={len(payload.get('items', []))} news={news}"
          )
          PY
