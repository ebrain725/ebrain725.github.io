name: Sync Ministry Policies

on:
  schedule:
    # GitHub cron is UTC. The five runs below are 08:17, 10:17,
    # 13:17, 15:17 and 18:17 every day in Korea (KST, UTC+9).
    - cron: "17 23 * * *"
    - cron: "17 1 * * *"
    - cron: "17 4 * * *"
    - cron: "17 6 * * *"
    - cron: "17 9 * * *"
  # Keep this trigger for manual runs and existing cron-job.org API calls.
  workflow_dispatch:
    inputs:
      trigger_type:
        description: "실행 주체(manual, scheduler 또는 cron-job.org)"
        required: false
        default: "manual"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

# This group is shared with the other Pages workflows in this repository so
# two deployments cannot publish over each other at the same time.
concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # All official actions below are Node 24 releases. This also keeps any
  # transitive JavaScript action on the supported Node 24 runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update-and-deploy:
    name: Collect, validate, commit and deploy policy data
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Show run source
        shell: bash
        env:
          DISPATCH_TRIGGER_TYPE: ${{ inputs.trigger_type }}
          REGISTERED_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            echo "실행 주체: GitHub schedule (${REGISTERED_SCHEDULE:-registered-cron})"
          else
            echo "실행 주체: ${DISPATCH_TRIGGER_TYPE:-manual-or-external-dispatch}"
          fi

      - name: Check files and secret configuration
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
          NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          test -f scripts/sync_policies.py || {
            echo "::error::scripts/sync_policies.py 파일을 찾지 못했습니다."
            exit 1
          }
          test -f config/settings.json || {
            echo "::error::config/settings.json 파일을 찾지 못했습니다."
            exit 1
          }

          missing=0
          if [[ -z "${NAVER_API_HUB_CLIENT_ID:-}" ]]; then
            echo "::error::NAVER_API_HUB_CLIENT_ID Repository Secret이 없습니다."
            missing=1
          fi
          if [[ -z "${NAVER_API_HUB_CLIENT_SECRET:-}" ]]; then
            echo "::error::NAVER_API_HUB_CLIENT_SECRET Repository Secret이 없습니다."
            missing=1
          fi
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::warning::OPENAI_API_KEY가 없어 정책 인사이트는 수집기의 기본 문구를 사용합니다."
          fi
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Check collector syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/sync_policies.py")
          compile(path.read_text(encoding="utf-8"), str(path), "exec")
          print("sync_policies.py 문법 검증 완료")
          PY

      - name: Collect ministry policies and news
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
          NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python scripts/sync_policies.py

      - name: Validate generated policies.json
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
          NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("public/data/policies.json")
          if not output.is_file():
              raise SystemExit("public/data/policies.json이 생성되지 않았습니다.")
          if output.stat().st_size > 5_000_000:
              raise SystemExit("policies.json이 5MB를 초과해 비정상으로 판단했습니다.")

          raw = output.read_text(encoding="utf-8")
          payload = json.loads(raw)
          if not isinstance(payload, dict):
              raise SystemExit("policies.json 최상위 값은 객체여야 합니다.")
          if not isinstance(payload.get("lastSync"), str) or not payload["lastSync"].strip():
              raise SystemExit("policies.json에 lastSync가 없습니다.")
          if not isinstance(payload.get("items"), list):
              raise SystemExit("policies.json의 items가 배열이 아닙니다.")
          if not payload["items"]:
              raise SystemExit("수집 결과가 0건이므로 기존 데이터를 덮어쓰지 않습니다.")

          required = {"title", "publishedAt", "source", "sourceType"}
          for index, item in enumerate(payload["items"]):
              if not isinstance(item, dict):
                  raise SystemExit(f"items[{index}]가 객체가 아닙니다.")
              missing = sorted(key for key in required if not str(item.get(key, "")).strip())
              if missing:
                  raise SystemExit(f"items[{index}] 필수값 누락: {', '.join(missing)}")
              if item.get("sourceType") == "news" and not str(item.get("url", "")).strip():
                  raise SystemExit(f"items[{index}] 뉴스 URL이 없습니다.")

          for env_name in (
              "OPENAI_API_KEY",
              "NAVER_API_HUB_CLIENT_ID",
              "NAVER_API_HUB_CLIENT_SECRET",
          ):
              secret = os.getenv(env_name, "")
              if secret and secret in raw:
                  raise SystemExit(f"보안값이 policies.json에 포함되었습니다: {env_name}")

          news_count = sum(item.get("sourceType") == "news" for item in payload["items"])
          print(f"검증 완료: 전체 {len(payload['items'])}건, 뉴스 {news_count}건")
          PY

      - name: Confirm only policies.json changed
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          target="public/data/policies.json"
          changed_paths="$({
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u)"

          unexpected=0
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if [[ "$path" != "$target" ]]; then
              echo "::error::수집기가 허용되지 않은 파일을 변경했습니다: $path"
              unexpected=1
            fi
          done <<< "$changed_paths"
          if [[ "$unexpected" -ne 0 ]]; then
            exit 1
          fi

          if [[ -n "$(git status --porcelain -- "$target")" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "policies.json 변경사항을 확인했습니다."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "저장할 변경사항이 없습니다. 최신 커밋의 사이트를 배포합니다."
          fi

      - name: Commit policies.json
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          target="public/data/policies.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$target"

          staged="$(git diff --cached --name-only)"
          if [[ "$staged" != "$target" ]]; then
            echo "::error::커밋 대상이 policies.json 한 파일이 아닙니다."
            printf '%s\n' "$staged"
            exit 1
          fi

          git commit -m "chore(data): sync ministry policies and news"

      - name: Rebase safely and push to main
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          pushed=0
          for attempt in 1 2 3; do
            echo "main 반영 시도 ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::원격 main과 policies.json 변경이 충돌했습니다. 강제 푸시하지 않습니다."
              exit 1
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
          done

          if [[ "$pushed" -ne 1 ]]; then
            echo "::error::원격 main이 계속 변경되어 3회 시도 후 중단했습니다. 다음 실행에서 재시도합니다."
            exit 1
          fi

          echo "policies.json을 main에 반영했습니다: $(git rev-parse HEAD)"

      - name: Align deployment source with a committed revision
        id: source_revision
        shell: bash
        run: |
          set -euo pipefail

          # The collector may overlap another data workflow. Always deploy the
          # newest committed main revision, never an uncommitted worktree.
          git fetch origin main
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          if [[ "$local_sha" != "$remote_sha" ]]; then
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::배포 직전 로컬 HEAD와 origin/main이 갈라졌습니다."
              exit 1
            fi
            git merge --ff-only origin/main
          fi

          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "::error::배포 원본이 최신 origin/main과 일치하지 않습니다."
            exit 1
          fi

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::배포 직전 작업트리가 커밋 상태와 다릅니다."
            git status --short
            exit 1
          fi

          committed_hash="$(git show HEAD:public/data/policies.json | sha256sum | awk '{print $1}')"
          worktree_hash="$(sha256sum public/data/policies.json | awk '{print $1}')"
          if [[ "$committed_hash" != "$worktree_hash" ]]; then
            echo "::error::배포할 policies.json이 현재 HEAD 커밋과 다릅니다."
            exit 1
          fi

          site_sha="$(git rev-parse HEAD)"
          echo "site_sha=$site_sha" >> "$GITHUB_OUTPUT"
          echo "data_sha256=$worktree_hash" >> "$GITHUB_OUTPUT"
          echo "배포 원본 커밋: $site_sha"
          echo "배포 데이터 SHA-256: $worktree_hash"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the committed public directory
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify the public policy data
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_DATA_SHA256: ${{ steps.source_revision.outputs.data_sha256 }}
        run: |
          set -euo pipefail

          page_root="${PAGE_URL%/}"
          verify_url="${page_root}/data/policies.json?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          downloaded="$(mktemp)"
          trap 'rm -f "$downloaded"' EXIT

          for attempt in 1 2 3 4 5 6 7 8; do
            echo "공개 데이터 확인 ${attempt}/8"
            if curl --fail --silent --show-error --location \
              --max-time 20 \
              --header "Cache-Control: no-cache" \
              "$verify_url" \
              --output "$downloaded"; then
              actual_sha256="$(sha256sum "$downloaded" | awk '{print $1}')"
              if [[ "$actual_sha256" == "$EXPECTED_DATA_SHA256" ]]; then
                echo "공개 policies.json 반영 확인: $actual_sha256"
                exit 0
              fi
              echo "아직 이전 데이터입니다: $actual_sha256"
            fi
            sleep 8
          done

          echo "::error::Pages 배포 후 공개 policies.json이 배포 원본과 일치하지 않습니다."
          exit 1
