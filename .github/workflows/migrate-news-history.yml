name: Migrate Policy News to Append-only History

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-news-history.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 운영 저장소와 전체 Git 이력 불러오기
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Python 준비
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 뉴스 보관 제한 제거
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          script_path = Path("scripts/sync_policies.py")
          text = script_path.read_text(encoding="utf-8")
          old_blocks = {
              '''    limit = max(1, min(int(settings.get("maxPolicyItems", 60)), 200))
              max_news = max(0, min(int(settings.get("maxNewsItems", 24)), limit))
          ''': '''    # 공식자료 최신분과 뉴스 누적이 서로 정원을 잠식하지 않도록 분리한다.
              # maxNewsItems가 0이면 뉴스는 삭제하지 않고 전기간 누적한다.
              official_limit = max(1, min(int(settings.get("maxPolicyItems", 60)), 500))
              max_news_setting = max(0, int(settings.get("maxNewsItems", 0) or 0))
              max_news = min(max_news_setting, 10000) if max_news_setting else 0
          ''',
              '''    news = [item for item in all_news if not is_routable_assembly_agenda_article(item)][:max_news]
          ''': '''    news_candidates = [item for item in all_news if not is_routable_assembly_agenda_article(item)]
              news = news_candidates[:max_news] if max_news else news_candidates
          ''',
              '''    official_capacity = max(0, limit - len(news))
          ''': '''    official_capacity = official_limit
          ''',
              '''    items = sorted(selected_official + news, key=lambda item: (item.get("publishedAt", ""), item.get("title", "")), reverse=True)[:limit]
          ''': '''    items = sorted(
                  selected_official + news,
                  key=lambda item: (item.get("publishedAt", ""), item.get("title", "")),
                  reverse=True,
              )
          ''',
          }
          for old, new in old_blocks.items():
              if old not in text:
                  if new.strip() in text:
                      continue
                  raise SystemExit(f"sync_policies.py 패치 대상이 없습니다: {old[:80]!r}")
              text = text.replace(old, new, 1)
          script_path.write_text(text, encoding="utf-8")

          settings_path = Path("config/settings.json")
          settings = json.loads(settings_path.read_text(encoding="utf-8"))
          settings["maxNewsItems"] = 0
          settings["maxPolicyItems"] = max(120, int(settings.get("maxPolicyItems", 78)))
          settings["newsRetentionPolicy"] = "append-only"
          settings["newsHistoryFile"] = "public/data/news-history.json"
          settings_path.write_text(json.dumps(settings, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          python -m py_compile scripts/sync_policies.py

      - name: Git 이력에서 과거 뉴스 복원
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          import sys
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          root = Path.cwd()
          sys.path.insert(0, str(root / "scripts"))
          import sync_policies as core

          policy_path = root / "public/data/policies.json"
          archive_path = root / "public/data/news-history.json"
          policy = json.loads(policy_path.read_text(encoding="utf-8"))

          def is_news(item):
              return isinstance(item, dict) and (
                  item.get("sourceType") == "news" or item.get("section") == "news"
              )

          def normalize(item):
              if not is_news(item):
                  return None
              row = dict(item)
              date = str(row.get("publishedAt") or row.get("date") or "")[:10]
              title = re.sub(r"\s+", " ", str(row.get("title") or "")).strip()
              url = str(row.get("url") or "").strip()
              if not re.fullmatch(r"20\d{2}-\d{2}-\d{2}", date) or not title or not url:
                  return None
              row.update({
                  "publishedAt": date,
                  "title": title,
                  "url": url,
                  "sourceType": "news",
                  "section": "news",
              })
              row["region"] = str(row.get("region") or core.news_region_for(row))
              row["category"] = str(row.get("category") or core.category_for(
                  f"{row.get('title', '')} {row.get('summary', '')}"
              ))
              stable = core.canonical_news_url(url) or f"{date}|{core.normalized_news_title(title)}"
              row["id"] = str(row.get("id") or hashlib.sha1(stable.encode()).hexdigest()[:16])
              for key in ("_trustedSearchMatch", "_bodyVerificationQueries", "_bodyCandidateScore", "_detailFetchFailed"):
                  row.pop(key, None)
              return row

          candidates = []
          current_news = [normalize(item) for item in policy.get("items", [])]
          candidates.extend(item for item in current_news if item)

          commits = subprocess.check_output(
              ["git", "log", "--max-count=500", "--format=%H", "--", "public/data/policies.json"],
              text=True,
          ).splitlines()
          parsed_commits = 0
          for commit in commits:
              shown = subprocess.run(
                  ["git", "show", f"{commit}:public/data/policies.json"],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              if shown.returncode != 0 or not shown.stdout.strip():
                  continue
              try:
                  document = json.loads(shown.stdout)
              except json.JSONDecodeError:
                  continue
              parsed_commits += 1
              for raw in document.get("items", []):
                  item = normalize(raw)
                  if item:
                      candidates.append(item)

          exact = {}
          for item in candidates:
              canonical = core.canonical_news_url(item.get("url", ""))
              key = canonical or f"{item.get('publishedAt')}|{core.normalized_news_title(item.get('title', ''))}"
              if key in exact:
                  exact[key] = core.merge_news_metadata(exact[key], item)
              else:
                  exact[key] = item
          news = core.dedupe_news(list(exact.values()))
          news = [
              normalize(item) for item in news
              if not core.is_routable_assembly_agenda_article(item)
          ]
          news = [item for item in news if item]
          news.sort(key=lambda item: (item.get("publishedAt", ""), item.get("title", "")), reverse=True)

          others = [item for item in policy.get("items", []) if not is_news(item)]
          policy["items"] = sorted(
              [*others, *news],
              key=lambda item: (str(item.get("publishedAt", "")), str(item.get("title", ""))),
              reverse=True,
          )
          dates = [item["publishedAt"] for item in news]
          now = datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds")
          archive = {
              "schemaVersion": "1.0",
              "generatedAt": now,
              "retentionPolicy": "append-only",
              "itemCount": len(news),
              "earliest": min(dates) if dates else None,
              "latest": max(dates) if dates else None,
              "gitHistory": {
                  "commitsSeen": len(commits),
                  "commitsParsed": parsed_commits,
                  "candidateCount": len(candidates),
              },
              "items": news,
          }
          policy["newsHistory"] = {
              "file": "data/news-history.json",
              "generatedAt": now,
              "retentionPolicy": "append-only",
              "itemCount": len(news),
              "earliest": archive["earliest"],
              "latest": archive["latest"],
          }
          archive_path.write_text(json.dumps(archive, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          policy_path.write_text(json.dumps(policy, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          if len(news) <= 24:
              raise SystemExit(f"과거 뉴스 복원 후에도 {len(news)}건뿐입니다.")
          print(f"뉴스 복원 완료: {len(news)}건 / {archive['earliest']}~{archive['latest']} / Git {parsed_commits}개 버전")
          PY

      - name: 누적 뉴스 포함 엑셀 재생성
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/export_policy_radar_excel.py
          python scripts/export_policy_radar_excel.py \
            --policy-path public/data/policies.json \
            --bill-path public/data/bills.json \
            --seminar-path public/data/assembly_seminars.json \
            --output public/data/ets-policy-radar-events.xlsx \
            --manifest public/data/policy-radar-excel.json

      - name: 변경 결과 검증
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          import zipfile
          from pathlib import Path

          archive = json.loads(Path("public/data/news-history.json").read_text(encoding="utf-8"))
          policy = json.loads(Path("public/data/policies.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("public/data/policy-radar-excel.json").read_text(encoding="utf-8"))
          news = [item for item in policy.get("items", []) if item.get("sourceType") == "news"]
          count = int(archive.get("itemCount", -1))
          if archive.get("retentionPolicy") != "append-only" or count != len(news) or count <= 24:
              raise SystemExit(f"뉴스 누적 검증 실패: archive={count}, policy={len(news)}")
          if int((manifest.get("counts") or {}).get("뉴스", -1)) != count:
              raise SystemExit("엑셀 뉴스 시트 건수가 누적 뉴스와 다릅니다.")
          with zipfile.ZipFile("public/data/ets-policy-radar-events.xlsx") as xlsx:
              if xlsx.testzip() is not None:
                  raise SystemExit("XLSX 무결성 검사 실패")
          print(f"최종 뉴스 {count}건 · 화면 {math.ceil(count / 5)}페이지")
          PY

      - name: 운영 main에 저장
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            scripts/sync_policies.py \
            config/settings.json \
            public/data/news-history.json \
            public/data/policies.json \
            public/data/ets-policy-radar-events.xlsx \
            public/data/policy-radar-excel.json
          git commit -m "fix: preserve policy news as append-only history"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi
            sleep $((attempt * 3))
          done

      - name: 배포 원본 해시 계산
        id: source_hash
        shell: bash
        run: |
          set -euo pipefail
          echo "archive=$(sha256sum public/data/news-history.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "policies=$(sha256sum public/data/policies.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "xlsx=$(sha256sum public/data/ets-policy-radar-events.xlsx | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "manifest=$(sha256sum public/data/policy-radar-excel.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 공개 파일 묶기
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 공개본 확인
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          ARCHIVE_SHA256: ${{ steps.source_hash.outputs.archive }}
          POLICIES_SHA256: ${{ steps.source_hash.outputs.policies }}
          XLSX_SHA256: ${{ steps.source_hash.outputs.xlsx }}
          MANIFEST_SHA256: ${{ steps.source_hash.outputs.manifest }}
        run: |
          set -euo pipefail
          root="${PAGE_URL%/}"
          verify() {
            path="$1"; expected="$2"; output="$(mktemp)"
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl -fsSL --max-time 45 -H "Cache-Control: no-cache" \
                "${root}/${path}?verify=${GITHUB_RUN_ID}-${attempt}" -o "$output"; then
                actual="$(sha256sum "$output" | awk '{print $1}')"
                if [[ "$actual" == "$expected" ]]; then rm -f "$output"; return 0; fi
              fi
              sleep 8
            done
            rm -f "$output"
            echo "::error::공개 ${path} 검증 실패"
            return 1
          }
          verify "data/news-history.json" "$ARCHIVE_SHA256"
          verify "data/policies.json" "$POLICIES_SHA256"
          verify "data/ets-policy-radar-events.xlsx" "$XLSX_SHA256"
          verify "data/policy-radar-excel.json" "$MANIFEST_SHA256"
