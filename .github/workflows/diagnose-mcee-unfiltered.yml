name: Diagnose MCEE Unfiltered Archive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-mcee-unfiltered.yml"

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: press-list-0
            url: "https://www.mcee.go.kr/home/web/board/list.do?boardMasterId=939&menuId=10598&maxIndexPages=10&maxPageItems=50&pagerOffset=0"
          - label: press-list-50
            url: "https://www.mcee.go.kr/home/web/board/list.do?boardMasterId=939&menuId=10598&maxIndexPages=10&maxPageItems=50&pagerOffset=50"
          - label: press-rss-0
            url: "https://www.mcee.go.kr/home/web/board/rss.do?boardMasterId=939&menuId=10598&maxPageItems=50&pagerOffset=0"
          - label: press-rss-50
            url: "https://www.mcee.go.kr/home/web/board/rss.do?boardMasterId=939&menuId=10598&maxPageItems=50&pagerOffset=50"
          - label: notice-list-0
            url: "https://www.mcee.go.kr/home/web/board/list.do?boardMasterId=39&menuId=10524&maxIndexPages=10&maxPageItems=50&pagerOffset=0"
          - label: notice-list-50
            url: "https://www.mcee.go.kr/home/web/board/list.do?boardMasterId=39&menuId=10524&maxIndexPages=10&maxPageItems=50&pagerOffset=50"
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe ${{ matrix.label }}
        shell: bash
        env:
          TARGET_URL: ${{ matrix.url }}
          LABEL: ${{ matrix.label }}
        run: |
          set -u
          output="/tmp/${LABEL}.txt"
          set +e
          code="$(curl -4 --http1.1 --location --compressed \
            --connect-timeout 15 --max-time 120 --retry 1 --retry-all-errors \
            --user-agent 'Mozilla/5.0 (compatible; ETS-LIVE-DASHBOARD/4.0)' \
            --header 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
            --silent --show-error --output "$output" --write-out '%{http_code}' "$TARGET_URL")"
          status=$?
          set -e
          bytes=0
          [[ -f "$output" ]] && bytes="$(wc -c < "$output")"
          echo "label=${LABEL} curl_status=${status} http_code=${code} bytes=${bytes}"
          if [[ -f "$output" && "$bytes" -gt 0 ]]; then
            python - "$output" <<'PY'
          import html
          import re
          import sys
          import urllib.parse
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          ids=[]
          dates=[]
          titles=[]
          for row in re.findall(r'<tr\b[^>]*>(.*?)</tr>', text, re.I|re.S):
              anchor = re.search(r'<a\b([^>]*href=["\'][^"\']*board/read\.do[^"\']*["\'][^>]*)>(.*?)</a>', row, re.I|re.S)
              if not anchor:
                  continue
              attrs=html.unescape(anchor.group(1))
              hrefm=re.search(r'href=["\']([^"\']+)', attrs, re.I)
              href=hrefm.group(1) if hrefm else ''
              idm=re.search(r'(?:[?&]|&amp;)boardId=(\d+)', href, re.I)
              if not idm:
                  idm=re.search(r'boardId=(\d+)', href, re.I)
              if idm:
                  ids.append(idm.group(1))
              title_attr=re.search(r'title=["\']([^"\']+)', attrs, re.I)
              title=html.unescape(title_attr.group(1) if title_attr else re.sub(r'<[^>]+>',' ',anchor.group(2)))
              title=re.sub(r'\s+',' ',title).strip()
              if title:
                  titles.append(title)
              date_matches=re.findall(r'20\d{2}[./-]\d{1,2}[./-]\d{1,2}', re.sub(r'<[^>]+>',' ',row))
              dates.extend(date_matches)
          rss_items=len(re.findall(r'<item\b',text,re.I))
          rss_dates=re.findall(r'<pubDate>(.*?)</pubDate>',text,re.I|re.S)
          print('html_row_count=',len(ids),'rss_item_count=',rss_items)
          print('first_ids=',ids[:5],'last_ids=',ids[-5:])
          print('first_dates=',dates[:5],'last_dates=',dates[-5:])
          print('first_titles=',titles[:3])
          print('rss_dates=',[re.sub(r'\s+',' ',x).strip() for x in rss_dates[:3]])
          print('title=',re.sub(r'\s+',' ',html.unescape((re.search(r'<title[^>]*>(.*?)</title>',text,re.I|re.S) or [None,''])[1])).strip()[:200])
          PY
          fi
          exit 0
